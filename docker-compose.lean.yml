# docker-compose.lean.yml — the LEAN production profile (PRODUCTION_DEPLOY_PLAN
# §2/§2c, prd-4): the public distribution point on a small VM, written
# SWARM-FIRST so `docker stack deploy` honours every line and `docker compose`
# runs the same file on a laptop (pol suite up --env lean).
#
#   pol prod guide              the guided setup (writes .generated/* below)
#   pol swarm deploy lean       → stack polari-lean (pol prod deploy does this)
#   pol suite up --env lean     the same file under compose (laptop try-out)
#
# Four services: the edge proxy, the hub (site + docs), the Polari frontend and
# ONE Polari backend on sqlite with the floor module set (app definitions, the
# store/downloads, the isle catalog, terms). No MinIO, scorecard or Odoo.
# TWO MORE, behind the `logins` profile (2026-09-17): pol-keycloak and its own
# pol-kc-mariadb — real sign-in without the full stack. Everything a
# node needs travels as a docker config/secret; the three host-path binds
# (platform debs, apt tree, ACME webroot) live on the manager, where the
# proxy/backend are pinned — a one-node droplet or the home swarm's manager.
#
# Rules kept (§2): no build:, no mem_limit, no depends_on conditions —
# deploy.resources / placement / restart_policy instead. `profiles:` is allowed
# ONLY as the odoo pattern already used in docker-compose.prod.yml: swarm has no
# profiles, so a gated service reaches the stack only when BOTH COMPOSE_PROFILES
# selects it for `docker compose config` AND stackify.py is given
# --with-profile <name>. Never put a service the plain lean stack needs there.
# Inputs (all generated by pol prod, none hand-edited):
#   .generated/.env.lean                        PROD_DOMAIN, POLARI_IMAGE_TAG, module set
#   .generated/nginx.lean.conf                  from pol-proxy/nginx.lean.conf.template
#   .generated/certs/edge/{fullchain,privkey}.pem   Let's Encrypt or self-signed (pol prod cert)
#   .generated/prf-runtime-config.lean.json     the frontend's per-domain config
#   .generated/pol-hub-runtime-config.lean.json the hub's project links
#   .generated/{debs,apt,certbot-www}/          the distribution point's directories

services:
  pol-proxy:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    networks: [polari-lean]
    configs:
      - source: nginx_lean_conf
        target: /etc/nginx/nginx.conf
    secrets:
      - source: edge_fullchain
        target: /etc/nginx/certs/pol-proxy.crt
      - source: edge_privkey
        target: /etc/nginx/certs/pol-proxy.key
    volumes:
      - ${POL_SUITE_ROOT:-.}/.generated/apt:/srv/apt:ro
      - ${POL_SUITE_ROOT:-.}/.generated/certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/.well-known/acme-challenge/health-probe"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["node.role == manager"]
      resources:
        limits: { memory: 64M, cpus: "0.2" }
        reservations: { memory: 16M }
      restart_policy: { condition: any, delay: 5s }

  pol-hub:
    image: ${POLARI_IMAGE_REPO:-}pol-hub:${POLARI_IMAGE_TAG:-lean}
    networks: [polari-lean]
    configs:
      - source: hub_runtime_config
        target: /usr/share/nginx/html/assets/runtime-config.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits: { memory: 32M, cpus: "0.1" }
      restart_policy: { condition: any, delay: 5s }

  prf-frontend:
    image: ${POLARI_IMAGE_REPO:-}prf-frontend:${POLARI_IMAGE_TAG:-lean}
    networks: [polari-lean]
    configs:
      - source: prf_runtime_config
        target: /usr/share/nginx/html/assets/runtime-config.json
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits: { memory: 96M, cpus: "0.2" }
      restart_policy: { condition: any, delay: 5s }

  prf-backend:
    image: ${POLARI_IMAGE_REPO:-}prf-backend:${POLARI_IMAGE_TAG:-lean}
    networks: [polari-lean]
    environment:
      - DEPLOY_ENV=production
      - IN_DOCKER_CONTAINER=true
      - POLARI_DEPLOY_ROUTE=swarm       # hardware kinds: Polari side only here (moduleService/hardware_reach.py — a notice, never a refusal)
      - POLARI_POSTURE=${POLARI_POSTURE:-production}   # a swarm server is production unless a developer says dev (the notice bar warns)
      - POLARI_FETCHED_MODULES_DIR=/app/data/modules   # modules fetched at runtime (fetch-admit, the apps API) live on the data volume, not in the container
      - POLARI_INSTANCE_NAME=prf-public
      - POLARI_INSTANCE_ID=public
      # sqlite, no object store, no Keycloak issuer → auth off (D2 default for the distribution server)
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/app/data/polari.db
      - OBJECT_STORAGE_ENABLED=false
      - SSL_ENABLED=false
      - CORS_ENABLED=true
      - CORS_ORIGINS=${CORS_ORIGINS:-https://${PROD_DOMAIN},https://www.${PROD_DOMAIN},https://prf.${PROD_DOMAIN}}
      # logins (the `logins` profile below): empty when off, so a plain lean stack is unchanged —
      # accessControl/jwt_validator.py needs BOTH the JWKS and the ISSUER before it validates anything
      - POLARI_AUTH=${POLARI_AUTH:-off}
      - POLARI_KEYCLOAK_ISSUER_URI=${POLARI_KEYCLOAK_ISSUER_URI:-}
      - POLARI_KEYCLOAK_JWKS_URI=${POLARI_KEYCLOAK_JWKS_URI:-}
      - POLARI_KEYCLOAK_ADMIN_URL=${POLARI_KEYCLOAK_ADMIN_URL:-}
      - POLARI_KEYCLOAK_REALM=${POLARI_KEYCLOAK_REALM:-}
      - POLARI_KEYCLOAK_ADMIN_CLIENT_ID=${POLARI_KEYCLOAK_ADMIN_CLIENT_ID:-}
      - POLARI_KEYCLOAK_FRONTEND_CLIENT_ID=${POLARI_KEYCLOAK_FRONTEND_CLIENT_ID:-polari-frontend}
      - KEYCLOAK_POLARI_BACKEND_CLIENT_SECRET=${KEYCLOAK_POLARI_BACKEND_CLIENT_SECRET:-}
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_PORT=3001
      # the floor set (§2c) + terms; lazy two-phase boot so /api/health flips early
      - POLARI_MODULES=${POLARI_LEAN_MODULES:-polariapps,appstore,islemesh,terms,security,iso}
      - POLARI_LAZY_BOOT=1
      - POLARI_MESH_AUTOCONFIG=false
      # the distribution point: staged platform debs + the on-demand pool
      - POLARI_DOWNLOADS_DIR=/app/downloads
      - POLARI_APP_DEBS_DIR=/app/data/app-debs
      - POLARI_APP_DEB_TTL=${POLARI_APP_DEB_TTL:-3600}
    volumes:
      - prf_lean_data:/app/data
      - ${POL_SUITE_ROOT:-.}/.generated/debs:/app/downloads:ro
      - ${POL_SUITE_ROOT:-.}/.generated/keys:/app/data/keys:ro   # the core's outward ssh public key (pol iso keys init) — placed on every image
      # posture (§17): on the swarm the POLARI_POSTURE env above is the source of truth (a bind of /etc/polari is rejected by swarm when the
      # host has no such directory — seen 2026-09-15); the isle compose mounts /etc/polari:ro where posture.sh / the ISO install wrote it
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["node.role == manager"]
      resources:
        limits:
          memory: "${POLARI_BACKEND_MEM:-1200M}"
          cpus: "1.5"
        reservations:
          memory: 512M
      restart_policy: { condition: any, delay: 10s }

  # ---------------------------------------------------------------- logins
  # REAL LOGINS ON THE LEAN STACK (2026-09-17). Both services sit behind the
  # `logins` compose profile, so a lean stack without logins is byte-identical
  # to what it was: `docker compose config` drops them unless COMPOSE_PROFILES
  # selects them, and stackify.py drops them unless `--with-profile logins` is
  # named (swarm has no profiles). `pol prod` does both when the answers are
  # POL_PROD_AUTH=keycloak + POL_PROD_PROFILE=lean.
  #
  # This is NOT the full profile's Keycloak: its own small MariaDB (not the
  # shared pol-mariadb serving the scorecard too), and the edge reaches it over
  # PLAIN HTTP inside the encrypted overlay rather than the full profile's mTLS
  # hop to :8443 — the lean path never runs setup-polari-security.sh, so those
  # certificates do not exist here.
  pol-kc-mariadb:
    image: ${POLARI_IMAGE_REPO:-}pol-mariadb:${POLARI_IMAGE_TAG:-lean}
    profiles: ["logins"]
    networks: [polari-lean]
    environment:
      # baked into the volume on FIRST boot; pol prod re-reads the previous
      # .env.lean so a re-apply never changes them under a live database
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:-}
    volumes:
      - kc_lean_db:/var/lib/mysql
    command: >
      --innodb-buffer-pool-size=96M
      --innodb-log-file-size=32M
      --max-connections=40
      --tmp-table-size=16M
      --max-heap-table-size=16M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["node.role == manager"]
      resources:
        limits: { memory: 384M, cpus: "0.5" }
        reservations: { memory: 128M }
      restart_policy: { condition: any, delay: 10s }

  pol-keycloak:
    image: ${POLARI_IMAGE_REPO:-}pol-keycloak:${POLARI_IMAGE_TAG:-lean}
    profiles: ["logins"]
    networks: [polari-lean]
    configs:
      - source: keycloak_lean_conf
        target: /opt/keycloak/conf/keycloak.conf
    # no depends_on: swarm ignores startup conditions — Keycloak exits when the
    # database is not there yet and the restart policy brings it back.
    entrypoint: ["/opt/startup_shells/kc_entrypoint.sh"]
    environment:
      - JAVA_OPTS_APPEND=-Xms256m -Xmx640m -XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -Djava.net.preferIPv4Stack=true
      - KEYCLOAK_MODE=production           # configure_clients.sh: derive the prf./auth. redirect URIs from KC_HOSTNAME
      - KC_HOSTNAME=${KC_HOSTNAME:-}
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded        # the edge terminates TLS; the issuer must come out https://auth.<domain>
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:-}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      - KEYCLOAK_POLARI_BACKEND_CLIENT_SECRET=${KEYCLOAK_POLARI_BACKEND_CLIENT_SECRET:-}
      - PRF_URL=${PRF_URL:-}
      # demonstration accounts — seed_demo_users.sh runs only when this is 'on'
      - POLARI_DEMO_USERS=${POLARI_DEMO_USERS:-off}
      - DEMO_USER_PASSWORD=${DEMO_USER_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready >/dev/null || curl -sf http://localhost:8080/realms/master >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["node.role == manager"]
      resources:
        limits: { memory: 1024M, cpus: "0.75" }
        reservations: { memory: 384M }
      restart_policy: { condition: any, delay: 15s }

configs:
  keycloak_lean_conf:
    file: ${POL_SUITE_ROOT:-.}/pol-keycloak/environments/keycloak-lean.conf
  nginx_lean_conf:
    file: ${POL_SUITE_ROOT:-.}/.generated/nginx.lean.conf
  prf_runtime_config:
    file: ${POL_SUITE_ROOT:-.}/.generated/prf-runtime-config.lean.json
  hub_runtime_config:
    file: ${POL_SUITE_ROOT:-.}/.generated/pol-hub-runtime-config.lean.json

secrets:
  edge_fullchain:
    file: ${POL_SUITE_ROOT:-.}/.generated/certs/edge/fullchain.pem
  edge_privkey:
    file: ${POL_SUITE_ROOT:-.}/.generated/certs/edge/privkey.pem

volumes:
  prf_lean_data:
  kc_lean_db:     # Keycloak's own database (the `logins` profile); unused when logins are off

networks:
  polari-lean:
    driver: overlay
    driver_opts:
      encrypted: "true"
    attachable: true
