# polari-jenkins — host-tier controller. Built-in node runs the jobs
# (single-host setup); the docker socket is mounted so jobs build images
# and run the suite's builders. Nothing published; UI on loopback only.
services:
  jenkins:
    build:
      context: ./controller
    image: polari-jenkins:local
    container_name: polari-jenkins
    restart: unless-stopped
    # ci-7 (C): after `sudo pol jenkins init-device` this is the polari-ci
    # system user — the "pipeline process" that may read the secrets. Before
    # it has run, the fallback is the host user and the doctor says loudly
    # that the secrets are then readable by every process of that user.
    user: "${JENKINS_UID:-${UID:-1000}}:${JENKINS_GID:-${GID:-1000}}"
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.model.DirectoryBrowserSupport.CSP=
      - CASC_JENKINS_CONFIG=/var/jenkins_casc/jenkins.yaml
      - JENKINS_OPTS=--httpListenAddress=0.0.0.0
      - HOME=/var/jenkins_home
      - POLARI_POOL=/var/polari-pool
      # ci-7: the pipeline device configuration reaches the jobs (and casc's
      # numExecutors) as environment; `pol jenkins up` exports it from device.env.
      - CI_EXECUTORS=${CI_EXECUTORS:-1}
      - CI_ROUTES=${CI_ROUTES:-github-release,ghcr,homebrew,apt-repo}
      - CI_ISLE_TARGET=${CI_ISLE_TARGET:-local}
      - CI_ISLE_SSH_HOST=${CI_ISLE_SSH_HOST:-}
      - CI_ISLE_SSH_USER=${CI_ISLE_SSH_USER:-}
      - CI_ISLE_VM_NAME=${CI_ISLE_VM_NAME:-polari-ci-isle}
      - CI_ISLE_VM_RAM_GB=${CI_ISLE_VM_RAM_GB:-4}
      - CI_ISLE_VM_VCPUS=${CI_ISLE_VM_VCPUS:-2}
      - CI_ISLE_VM_DISK_GB=${CI_ISLE_VM_DISK_GB:-30}
      - CI_ISLE_NESTED=${CI_ISLE_NESTED:-auto}
      - CI_MIN_FREE_GB=${CI_MIN_FREE_GB:-20}
      - CI_MIN_RAM_HEADROOM_GB=${CI_MIN_RAM_HEADROOM_GB:-1}
      # ci-9: the offline-first cache. CI_CACHE_DIR is deliberately left empty by
      # default so it resolves to <pool>/cache INSIDE the container (/var/polari-pool),
      # which is the same directory as polari-jenkins/pool/cache on the host.
      - CI_CACHE=${CI_CACHE:-on}
      - CI_CACHE_DIR=${CI_CACHE_DIR:-}
      - CI_CACHE_MAX_GB=${CI_CACHE_MAX_GB:-40}
      - CI_CACHE_PROXIES=${CI_CACHE_PROXIES:-off}
      # ci-9: app mode — what this device maintains, and where ITS releases go
      - CI_MODE=${CI_MODE:-suite}
      - CI_APP_NAME=${CI_APP_NAME:-}
      - CI_APP_REPO=${CI_APP_REPO:-}
      - CI_CORE_SOURCE=${CI_CORE_SOURCE:-release:latest}
      - CI_ROUTE_TARGET=${CI_ROUTE_TARGET:-}
      # ci-12 — the branch model's scheduling knobs. ENVIRONMENT knobs, not
      # device.env keys: they are about how THIS controller schedules, not about
      # the device's identity (the ci-10 leak tolerances set that precedent).
      #   CI_QUIET_MINUTES       how long the whole forest must stop moving before a run starts
      #   CI_MAX_DEFER_MINUTES   0 = unlimited; his default is to keep putting it off
      #   CI_SELFTEST_IMAGE      the image the module selftests run in
      #   CI_SELFTEST_TIMEOUT_S  per suite
      #   CI_BUILD_OFFLINE_MEDIUM  the offline medium knob, now that the polled release job takes no parameters
      - CI_QUIET_MINUTES=${CI_QUIET_MINUTES:-5}
      - CI_MAX_DEFER_MINUTES=${CI_MAX_DEFER_MINUTES:-0}
      - CI_SELFTEST_IMAGE=${CI_SELFTEST_IMAGE:-prf-backend:staging}
      - CI_SELFTEST_TIMEOUT_S=${CI_SELFTEST_TIMEOUT_S:-300}
      - CI_BUILD_OFFLINE_MEDIUM=${CI_BUILD_OFFLINE_MEDIUM:-true}
      - CI_DEVICE_NAME=${CI_DEVICE_NAME:-pipeline}
    volumes:
      - ${JENKINS_HOME:-./jenkins_home}:/var/jenkins_home
      - ./casc:/var/jenkins_casc:ro
      - ./jobs:/var/polari-jenkins/jobs:ro
      - ./pipelines:/var/polari-jenkins/pipelines:ro
      - ./routes:/var/polari-jenkins/routes:ro
      - ./retention.sh:/var/polari-jenkins/retention.sh:ro
      - ./isle:/var/polari-jenkins/isle:ro
      - ./mint-tag.sh:/var/polari-jenkins/mint-tag.sh:ro
      - ./device.sh:/var/polari-jenkins/device.sh:ro
      # ci-8: the two directions between this device and the Polari core that
      # OWNS these settings (pull rewrites device.env; the mirror posts runs)
      - ./cicd-sync.sh:/var/polari-jenkins/cicd-sync.sh:ro
      - ./secrets.sh:/var/polari-jenkins/secrets.sh:ro
      # ci-9: the offline-first cache — the library, its manifest reader and the
      # (opt-in) tier-two door. The cache DATA itself is under ./pool, already mounted.
      - ./cache.sh:/var/polari-jenkins/cache.sh:ro
      - ./cache-manifest.py:/var/polari-jenkins/cache-manifest.py:ro
      - ./cache-proxies.sh:/var/polari-jenkins/cache-proxies.sh:ro
      # …and the image builder that reads it (the `images` stage of dev-build and
      # release calls this path; without the mount the stage dies with rc=127).
      - ./build-images.sh:/var/polari-jenkins/build-images.sh:ro
      # ci-12 — the branch model's own pieces. quiet.sh owns the 5-minute quiet
      # window and the one-deep queue; test-wipe.sh is the "wipe what we have
      # locally" step; selftests.sh runs the module suites in the freshly built
      # backend image; verdict.py is the ONE place the verdict arithmetic lives;
      # scan/ is the advisory scanning layer (scn-0).
      - ./quiet.sh:/var/polari-jenkins/quiet.sh:ro
      - ./test-wipe.sh:/var/polari-jenkins/test-wipe.sh:ro
      - ./selftests.sh:/var/polari-jenkins/selftests.sh:ro
      - ./verdict.py:/var/polari-jenkins/verdict.py:ro
      - ./scan:/var/polari-jenkins/scan:ro
      - ./scan-tools.lock:/var/polari-jenkins/scan-tools.lock:ro
      # /etc/polari-jenkins/secrets (root:polari-ci 0640) after init-device;
      # ./secrets (host user, 0600) only until it has run — see secrets/README.md
      - ${POLARI_SECRETS_DIR:-./secrets}:/run/secrets:ro
      - ./pool:/var/polari-pool
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 2g
