# ==============================================================================
# POLARI SUITE - PRODUCTION (overlay with resource limits)
# ==============================================================================
#
# Optimized for: DigitalOcean Basic Droplet - 4GB RAM / 2 vCPU / 60GB
# Target: 1 user with comfortable headroom
#
# SETUP (run once, or when domain/config changes):
#   ./prod-setup.sh
#
# This is an OVERLAY file - use with base docker-compose.yml:
#
# USAGE:
#   sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# MEMORY BUDGET (4GB total):
#   - OS/Docker overhead: ~500MB
#   - Keycloak:           1024MB (Java - needs the most)
#   - psc-backend:         768MB (Spring Boot)
#   - pol-mariadb:         512MB (Database)
#   - prf-backend:         384MB (Python)
#   - psc-redis:           128MB (Cache)
#   - psc-frontend:         64MB (nginx static)
#   - prf-frontend:         64MB (nginx static)
#   - pol-proxy:            64MB (nginx proxy)
#   - Buffer:             ~512MB
#   --------------------------------
#   Total allocated:     ~3.5GB
#
# ==============================================================================

services:
  # ============================================
  # SHARED DATABASE SERVICES
  # ============================================

  pol-mariadb:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --query-cache-size=0
      --tmp-table-size=16M
      --max-heap-table-size=16M

  psc-redis:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.05'
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru

  # ============================================
  # PROXY SERVICE (uses generated prod config)
  # ============================================

  pol-proxy:
    build:
      args:
        NGINX_CONF: nginx.prod.conf
    volumes:
      # Mount generated nginx config (from prod-setup.sh)
      - ./.generated/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'

  # ============================================
  # AUTHENTICATION SERVICES
  # ============================================

  pol-keycloak:
    env_file:
      - ./.generated/.env.prod
    environment:
      # JVM memory limits for Keycloak
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.net.preferIPv4Stack=true
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.2'

  # ============================================
  # POLITICAL SCORECARD (PSC) SERVICES
  # ============================================

  psc-frontend:
    build:
      context: ./political-scorecard-node/political-scorecard-frontend
      dockerfile: Dockerfile.prod
    image: psc-frontend:prod
    volumes:
      # Mount generated runtime config
      - ./.generated/psc-runtime-config.prod.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    command: []
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'

  psc-backend:
    build:
      context: ./political-scorecard-node/political-scorecard-backend
      dockerfile: Dockerfile.prod
    image: psc-backend:prod
    volumes: []
    command: []
    env_file:
      - ./.generated/.env.prod
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://pol-mariadb:3306/psc
      - SPRING_DATASOURCE_USERNAME=psc-scorecard-server
      # Password comes from .env.prod via PSC_DB_PASSWORD
      - SPRING_DATASOURCE_PASSWORD=${PSC_DB_PASSWORD:-pscpassword}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # ============================================
  # POLARI RESEARCH FRAMEWORK (PRF) SERVICES
  # ============================================

  prf-frontend:
    build:
      context: ./polari-rf-node/polari-platform-angular
      dockerfile: Dockerfile.prod
    image: prf-frontend:prod
    volumes:
      # Mount generated runtime config
      - ./.generated/prf-runtime-config.prod.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'

  prf-backend:
    env_file:
      - ./.generated/.env.prod
    environment:
      - DEPLOY_ENV=production
      # CORS_ORIGINS, PRF_API_URL come from .env.prod (domain-specific)
      # API Profiler: Internal URL (avoids hairpin NAT for self-calls)
      - INTERNAL_API_URL=http://localhost:3000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 45s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.4'
        reservations:
          memory: 128M
          cpus: '0.1'
