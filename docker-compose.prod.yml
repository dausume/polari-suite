# ==============================================================================
# POLARI SUITE - PRODUCTION ENVIRONMENT (subdomain routing)
# ==============================================================================
#
# Optimized for: DigitalOcean Basic Droplet - 4GB RAM / 2 vCPU / 60GB
# Target: 1 user with comfortable headroom
#
# SETUP (run once, or when domain/config changes):
#   ./prod-setup.sh
#
# USAGE:
#   sudo docker compose -f docker-compose.prod.yml up -d --build
#
# ACCESS (using your domain, e.g., example.com):
#   - Landing:       https://example.com
#   - Keycloak:      https://auth.example.com
#   - PSC Frontend:  https://psc.example.com
#   - PSC API:       https://api.psc.example.com
#   - PRF Frontend:  https://prf.example.com
#   - PRF API:       https://api.prf.example.com
#   - MinIO Console: https://files.example.com
#   - MinIO S3 API:  https://s3.example.com
#
# MEMORY BUDGET (4GB total):
#   - OS/Docker overhead: ~500MB
#   - Keycloak:           1024MB (Java - needs the most)
#   - psc-backend:         768MB (Spring Boot)
#   - pol-mariadb:         512MB (Database)
#   - prf-backend:         384MB (Python)
#   - pol-file-store:      256MB (MinIO S3 storage)
#   - psc-redis:           128MB (Cache)
#   - psc-frontend:         64MB (nginx static)
#   - prf-frontend:         64MB (nginx static)
#   - pol-proxy:            64MB (nginx proxy)
#   - Buffer:             ~256MB
#   --------------------------------
#   Total allocated:     ~3.8GB
#
# ==============================================================================

services:
  # ============================================
  # SHARED DATABASE SERVICES
  # ============================================

  pol-mariadb:
    build:
      context: ./pol-mariadb
      dockerfile: Dockerfile
    container_name: pol-mariadb
    image: pol-mariadb:prod
    restart: always
    networks:
      - polari-network
    env_file:
      - ./pol-mariadb/mariadb.env
      - ./.generated/.env.prod
    volumes:
      - pol_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --query-cache-size=0
      --tmp-table-size=16M
      --max-heap-table-size=16M

  # MinIO S3-compatible Object Storage - shared file store
  pol-file-store:
    build:
      context: ./pol-file-store
      dockerfile: Dockerfile
    container_name: pol-file-store
    image: pol-file-store:prod
    restart: always
    networks:
      - polari-network
    env_file:
      - ./.generated/.env.prod
    environment:
      # Tell MinIO its external URLs so presigned URLs and console redirects work
      - MINIO_SERVER_URL=https://s3.${PROD_DOMAIN}
      - MINIO_BROWSER_REDIRECT_URL=https://files.${PROD_DOMAIN}
    volumes:
      - pol_file_store_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.1'

  psc-redis:
    build: ./political-scorecard-node/political-scorecard-backend/redis
    container_name: psc-redis
    image: psc-redis:prod
    networks:
      - polari-network
    volumes:
      - psc_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.05'
    # KeyDB (eqalpha/keydb) ships keydb-server, NOT redis-server — and the
    # conf carries the ACL users the Spring backend authenticates with, so it
    # must be loaded. Keep the Dockerfile's config + add the memory caps.
    command: keydb-server /etc/keydb/keydb.conf --maxmemory 96mb --maxmemory-policy allkeys-lru

  # ============================================
  # PRODUCTION PROXY (subdomain routing)
  # ============================================

  pol-proxy:
    build:
      context: ./pol-proxy
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.dev.conf
    container_name: pol-proxy
    image: pol-proxy:prod
    ports:
      - "80:80"
      - "443:443"
    networks:
      - polari-network
    volumes:
      # Mount generated nginx config (from prod-setup.sh)
      - ./.generated/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      pol-keycloak:
        condition: service_started
      pol-file-store:
        condition: service_healthy
      psc-frontend:
        condition: service_started
      psc-backend:
        condition: service_healthy
      prf-frontend:
        condition: service_started
      prf-backend:
        condition: service_healthy

  # ============================================
  # AUTHENTICATION SERVICES
  # ============================================

  pol-keycloak:
    build:
      context: ./pol-keycloak
      dockerfile: Dockerfile.pol-kc
    container_name: pol-keycloak
    image: pol-keycloak:prod
    networks:
      - polari-network
    env_file:
      - ./pol-keycloak/keycloak-admin.env
      # KC_DB_PASSWORD env var overrides the mounted keycloak-suite.conf,
      # keeping Keycloak in sync with the generated DB credentials.
      - ./pol-mariadb/mariadb.env
      - ./.generated/.env.prod
    volumes:
      - ./pol-keycloak/environments/keycloak-suite.conf:/opt/keycloak/conf/keycloak.conf
    environment:
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.net.preferIPv4Stack=true
      - KEYCLOAK_MODE=production
    depends_on:
      pol-mariadb:
        condition: service_healthy
    entrypoint: ["/opt/startup_shells/kc_entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.2'

  # ============================================
  # POLITICAL SCORECARD (PSC) SERVICES
  # ============================================

  psc-frontend:
    build:
      context: ./political-scorecard-node/political-scorecard-frontend
      dockerfile: Dockerfile.prod
    container_name: psc-frontend
    image: psc-frontend:prod
    networks:
      - polari-network
    volumes:
      # Mount generated runtime config for production URLs
      - ./.generated/psc-runtime-config.prod.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      - psc-backend

  psc-backend:
    build:
      context: ./political-scorecard-node/political-scorecard-backend
      dockerfile: Dockerfile.prod
    container_name: psc-backend
    image: psc-backend:prod
    networks:
      - polari-network
    env_file:
      - ./.generated/.env.prod
      - ./pol-keycloak/keycloak-admin.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://pol-mariadb:3306/psc
      - SPRING_DATASOURCE_USERNAME=psc-scorecard-server
      # Password comes from .env.prod via PSC_DB_PASSWORD
      - SPRING_DATASOURCE_PASSWORD=${PSC_DB_PASSWORD:-pscpassword}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      # MinIO connection (internal Docker network)
      # Credentials come from .env.prod via MINIO_ACCESS_KEY / MINIO_SECRET_KEY
      - MINIO_ENDPOINT=http://pol-file-store:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-polari-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-polari-file-store-password}
      - MINIO_BUCKET=legislation
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    depends_on:
      pol-mariadb:
        condition: service_healthy
      pol-file-store:
        condition: service_healthy
      psc-redis:
        condition: service_started

  # ============================================
  # POLARI RESEARCH FRAMEWORK (PRF) SERVICES
  # ============================================

  prf-frontend:
    build:
      context: ./polari-rf-node/polari-platform-angular
      dockerfile: Dockerfile.prod
    container_name: prf-frontend
    image: prf-frontend:prod
    networks:
      - polari-network
    volumes:
      # Mount generated runtime config for production URLs
      - ./.generated/prf-runtime-config.prod.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      - prf-backend

  prf-backend:
    build:
      context: ./polari-rf-node/polari-framework
    container_name: prf-backend
    image: prf-backend:prod
    networks:
      - polari-network
    env_file:
      - ./.generated/.env.prod
      - ./pol-file-store/client.env
    environment:
      - DEPLOY_ENV=production
      # CORS_ORIGINS and PRF_API_URL come from .env.prod file
      # INTERNAL_API_URL: For API profiler self-call rewriting (avoids hairpin NAT)
      - INTERNAL_API_URL=http://localhost:3000
      # MinIO object storage
      - OBJECT_STORAGE_ENABLED=true
      - MINIO_ENDPOINT=pol-file-store:9000
      # Browser-reachable base URL for video-1 playback links — reuses
      # the generated MINIO_S3_URL (https://s3.<domain>) from the env-file.
      - MINIO_PUBLIC_URL=${MINIO_S3_URL}
      # WebSocket (STOMP) notifications
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_PORT=3001
    volumes:
      # Persist the framework object DB (SQLite at /app/data) across recreates
      # — without this, all module/user data lives in the container layer and
      # is wiped on every down/recreate. Mirrors the dev prf_backend_data mount.
      - prf_backend_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 900s   # cold first-boot DB seed is ~10-15 min (verbose per-instance logging); keep container in "starting" so a one-pass `up` waits it out
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.4'
        reservations:
          memory: 128M
          cpus: '0.1'
    depends_on:
      pol-file-store:
        condition: service_healthy
#
  # ============================================
  # POLARI WWW — informational hub (static, low-load front door)
  # ============================================
  pol-hub:
    build:
      context: ./pol-hub
    container_name: pol-hub
    image: pol-hub:prod
    networks:
      - polari-network
    volumes:
      # Per-env project URLs (prf / dps / mesh / oseb), read by the site JS.
      - ./.generated/pol-hub-runtime-config.prod.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.1'
        reservations:
          memory: 16M
          cpus: '0.02'

  # ============================================
  # ODOO ERP (business sims + real business ops)
  # ============================================

  # PostgreSQL for Odoo — the suite's FIRST postgres (Odoo requires it;
  # it does NOT reuse MariaDB). Profile 'odoo': NOT started by the
  # default suite up — bring up via `pol odoo up`; intended host is
  # econ-core (ODOO_INTEGRATION_PLAN.md od-0). Credentials:
  # pol-odoo-postgres/odoo-postgres.env (setup-polari-security.sh);
  # the password is BAKED into odoo-db-data at first init — same drift
  # class as mariadb.env (rescue: pol-odoo/README.md).
  odoo-postgres:
    profiles: ["odoo"]
    build:
      context: ./pol-odoo-postgres
      dockerfile: Dockerfile
    container_name: odoo-postgres
    image: pol-odoo-postgres:prod
    restart: always
    networks:
      - polari-network
    env_file:
      - ./pol-odoo-postgres/odoo-postgres.env
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Odoo 18 Community — ERP server, backbone of business SIMULATIONS
  # (odoo_sim DB) and REAL business ops (odoo_ops DB); the two must
  # never blur (ODOO_INTEGRATION_PLAN.md). Profile 'odoo': NOT started
  # by the default suite up — `pol odoo up`; intended host is econ-core
  # (od-0). Humans reach it at odoo.<domain> via pol-proxy (websocket
  # path /websocket -> :8072). Config pol-odoo/odoo.conf carries NO
  # secrets; DB creds come from pol-odoo/odoo.env (generated). DBs are
  # NOT auto-created — `pol odoo init-db <sim|ops>` after first up.
  odoo:
    profiles: ["odoo"]
    build:
      context: ./pol-odoo
      dockerfile: Dockerfile
    container_name: odoo
    image: pol-odoo:prod
    restart: always
    networks:
      - polari-network
    env_file:
      - ./pol-odoo/odoo.env
    volumes:
      - ./pol-odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-filestore:/var/lib/odoo
    depends_on:
      odoo-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8069/web/health', timeout=5).status==200 else 1)"]
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

# ============================================
# VOLUMES
# ============================================
volumes:
  pol_mariadb_data:
  pol_file_store_data:
  psc_redis_data:
  # PRF framework object DB (SQLite at /app/data) — persist across recreates.
  prf_backend_data:
  # Odoo ERP (profile 'odoo'): postgres data + filestore — mover-covered
  # subjects from day one (ODOO_INTEGRATION_PLAN.md od-6).
  odoo-db-data:
  odoo-filestore:

# ============================================
# NETWORKS
# ============================================
networks:
  polari-network:
    driver: bridge
