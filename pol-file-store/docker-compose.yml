# ==============================================================================
# POL-FILE-STORE - Standalone Proof-of-Concept
# ==============================================================================
#
# The suite's S3 object store — SeaweedFS (D-fs-1 2026-09-25; minio/minio left
# Docker Hub). ONE definition: polari-rf-node/prf-file-store (Dockerfile +
# entrypoint); this compose only builds it standalone. Buckets are created by
# the applications (PSC: MinioDatasourceInitializer / LegislationBucketInitializer).
#
# USAGE:
#   docker compose up -d --build           # Start the store
#   docker compose down                    # Stop
#
# ACCESS:
#   API:     http://localhost:9000   (S3-compatible)
#   Browser: http://127.0.0.1:9001   (the filer's file browser — loopback only; the store has no login on it)
#
# ==============================================================================

services:
  pol-file-store:
    build:
      context: ../polari-rf-node/prf-file-store
      dockerfile: Dockerfile
    container_name: pol-file-store
    image: pol-file-store:latest
    restart: always
    ports:
      - "9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # the filer's browser page — loopback only (no login of its own)
    env_file:
      - ./minio.env
    volumes:
      - pol_file_store_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s -o /dev/null http://localhost:9000/ && curl -sf http://localhost:9333/cluster/status >/dev/null"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pol_file_store_data:
