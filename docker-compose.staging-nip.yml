# ==============================================================================
# POLARI SUITE - STAGING ENVIRONMENT (nip.io subdomain routing)
# ==============================================================================
#
# Purpose: Test production builds locally WITH subdomain routing via nip.io
# Uses: Production Dockerfiles + Resource limits + Subdomain proxy (like real prod)
#
# SETUP (run once, or when IP changes):
#   ./nip-staging-setup.sh
#
# USAGE:
#   sudo docker compose -f docker-compose.staging-nip.yml --env-file .generated/.env.staging up -d --build
#
# ACCESS (auto-rendered from the configured LOCAL_IP):
#   - Landing:        https://192.168.1.50.nip.io
#   - Keycloak:       https://auth.192.168.1.50.nip.io
#   - PSC Frontend:   https://psc.192.168.1.50.nip.io
#   - PSC API:        https://api.psc.192.168.1.50.nip.io
#   - PRF Frontend:   https://prf.192.168.1.50.nip.io
#   - PRF API:        https://api.prf.192.168.1.50.nip.io
#   - MinIO Console:  https://files.192.168.1.50.nip.io
#   - MinIO S3 API:   https://s3.192.168.1.50.nip.io
#
# NOTE: extra_hosts use ${LOCAL_IP}, resolved from --env-file at LAUNCH time
# (the runtime knob); the doc URLs above are rendered from the CONFIGURED
# LOCAL_IP at BUILD time (env > .generated/.env.staging > route lookup).
#
# ==============================================================================

services:
  # ============================================
  # SHARED DATABASE SERVICES
  # ============================================

  pol-mariadb:
    build:
      context: ./pol-mariadb
      dockerfile: Dockerfile
    container_name: pol-mariadb
    image: pol-mariadb:staging
    restart: always
    networks:
      - polari-network
    env_file:
      - ./pol-mariadb/mariadb.env
      - ./.generated/.env.staging
    volumes:
      - pol_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --query-cache-size=0
      --tmp-table-size=16M
      --max-heap-table-size=16M

  # MinIO S3-compatible Object Storage - shared file store
  pol-file-store:
    build:
      context: ./pol-file-store
      dockerfile: Dockerfile
    container_name: pol-file-store
    image: pol-file-store:staging
    restart: always
    networks:
      - polari-network
    env_file:
      - ./pol-file-store/minio.env
    environment:
      # Tell MinIO its external URLs so presigned URLs and console redirects work
      - MINIO_SERVER_URL=https://s3.${BASE_DOMAIN}
      - MINIO_BROWSER_REDIRECT_URL=https://files.${BASE_DOMAIN}
    volumes:
      - pol_file_store_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.1'

  psc-redis:
    build: ./political-scorecard-node/political-scorecard-backend/redis
    container_name: psc-redis
    image: psc-redis:staging
    networks:
      - polari-network
    volumes:
      - psc_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.05'
    # KeyDB (eqalpha/keydb) ships keydb-server, NOT redis-server — and the
    # conf carries the ACL users the Spring backend authenticates with, so it
    # must be loaded. Keep the Dockerfile's config + add the memory caps.
    command: keydb-server /etc/keydb/keydb.conf --maxmemory 96mb --maxmemory-policy allkeys-lru

  # ============================================
  # STAGING PROXY (subdomain routing via nip.io)
  # ============================================

  pol-proxy:
    build:
      context: ./pol-proxy
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.dev.conf
    container_name: pol-proxy
    image: pol-proxy:staging
    ports:
      - "80:80"
      - "443:443"
    networks:
      - polari-network
    volumes:
      # Mount generated nginx config (from nip-staging-setup.sh)
      - ./.generated/nginx.staging.conf:/etc/nginx/nginx.conf:ro
      # Mount generated nip.io certificates
      - ./pol-proxy/certs/nip.io:/etc/nginx/certs/nip.io:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      pol-keycloak:
        condition: service_started
      pol-file-store:
        condition: service_healthy
      psc-frontend:
        condition: service_started
      psc-backend:
        condition: service_healthy
      prf-frontend:
        condition: service_started
      prf-backend:
        condition: service_healthy

  # ============================================
  # AUTHENTICATION SERVICES
  # ============================================

  pol-keycloak:
    build:
      context: ./pol-keycloak
      dockerfile: Dockerfile.pol-kc
    container_name: pol-keycloak
    image: pol-keycloak:staging
    networks:
      - polari-network
    env_file:
      - ./pol-keycloak/keycloak-admin.env
      # KC_DB_PASSWORD env var overrides the mounted keycloak-suite.conf,
      # keeping Keycloak in sync with the generated DB credentials.
      - ./pol-mariadb/mariadb.env
      - ./.generated/.env.staging
    volumes:
      - ./pol-keycloak/environments/keycloak-suite.conf:/opt/keycloak/conf/keycloak.conf
    environment:
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.net.preferIPv4Stack=true
      - KEYCLOAK_MODE=staging
    depends_on:
      pol-mariadb:
        condition: service_healthy
    entrypoint: ["/opt/startup_shells/kc_entrypoint.sh"]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.2'

  # ============================================
  # POLITICAL SCORECARD (PSC) SERVICES
  # ============================================

  psc-frontend:
    build:
      context: ./political-scorecard-node/political-scorecard-frontend
      dockerfile: Dockerfile.prod
    container_name: psc-frontend
    image: psc-frontend:staging
    networks:
      - polari-network
    volumes:
      # Mount generated runtime config for nip.io URLs
      - ./.generated/psc-runtime-config.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      - psc-backend

  psc-backend:
    build:
      context: ./political-scorecard-node/political-scorecard-backend
      dockerfile: Dockerfile.prod
    container_name: psc-backend
    image: psc-backend:staging
    networks:
      - polari-network
    env_file:
      - ./.generated/.env.staging
      - ./pol-keycloak/keycloak-admin.env
      # MINIO_ACCESS_KEY / MINIO_SECRET_KEY — generated client credentials
      # (mirrors pol-file-store/minio.env; setup-polari-security.sh owns both).
      - ./pol-file-store/client.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://pol-mariadb:3306/psc
      - SPRING_DATASOURCE_USERNAME=psc-scorecard-server
      # Resolved from --env-file .generated/.env.staging (nip-staging-setup.sh
      # syncs it from pol-mariadb/mariadb.env); default matches legacy volumes.
      - SPRING_DATASOURCE_PASSWORD=${PSC_DB_PASSWORD:-pscpassword}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms128m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      # MinIO connection (internal Docker network)
      - MINIO_ENDPOINT=http://pol-file-store:9000
      - MINIO_BUCKET=legislation
    extra_hosts:
      # Allow container to reach host machine via nip.io domains
      # Uses ${BASE_DOMAIN} from --env-file .generated/.env.staging
      - "${BASE_DOMAIN}:host-gateway"
      - "api.prf.${BASE_DOMAIN}:host-gateway"
      - "api.psc.${BASE_DOMAIN}:host-gateway"
      - "prf.${BASE_DOMAIN}:host-gateway"
      - "psc.${BASE_DOMAIN}:host-gateway"
      - "auth.${BASE_DOMAIN}:host-gateway"
      - "files.${BASE_DOMAIN}:host-gateway"
      - "s3.${BASE_DOMAIN}:host-gateway"
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    depends_on:
      pol-mariadb:
        condition: service_healthy
      pol-file-store:
        condition: service_healthy
      psc-redis:
        condition: service_started

  # ============================================
  # POLARI RESEARCH FRAMEWORK (PRF) SERVICES
  # ============================================

  prf-frontend:
    build:
      context: ./polari-rf-node/polari-platform-angular
      dockerfile: Dockerfile.prod
    container_name: prf-frontend
    image: prf-frontend:staging
    networks:
      - polari-network
    volumes:
      # Mount generated runtime config for nip.io URLs
      - ./.generated/prf-runtime-config.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'
    depends_on:
      - prf-backend

  prf-backend:
    build:
      context: ./polari-rf-node/polari-framework
    container_name: prf-backend
    image: prf-backend:staging
    networks:
      - polari-network
    env_file:
      - ./.generated/.env.staging
      - ./pol-file-store/client.env
    environment:
      - DEPLOY_ENV=staging
      # CORS_ORIGINS and PRF_API_URL will come from .env.staging file
      # INTERNAL_API_URL: For API profiler self-call rewriting (avoids hairpin NAT)
      - INTERNAL_API_URL=http://localhost:3000
      # MinIO object storage
      - OBJECT_STORAGE_ENABLED=true
      - MINIO_ENDPOINT=pol-file-store:9000
      # Browser-reachable base URL for video-1 playback links — reuses
      # the generated MINIO_S3_URL (https://s3.<domain>) from the env-file.
      - MINIO_PUBLIC_URL=${MINIO_S3_URL}
      # WebSocket (STOMP) notifications
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_PORT=3001
    volumes:
      # Persist the framework object DB (SQLite at /app/data) across recreates
      # — without this, all module/user data lives in the container layer and
      # is wiped on every down/recreate. Mirrors the dev prf_backend_data mount.
      - prf_backend_data:/app/data
    extra_hosts:
      # Allow container to reach host machine via nip.io domains
      # Uses ${BASE_DOMAIN} from --env-file .generated/.env.staging
      - "${BASE_DOMAIN}:host-gateway"
      - "api.prf.${BASE_DOMAIN}:host-gateway"
      - "api.psc.${BASE_DOMAIN}:host-gateway"
      - "prf.${BASE_DOMAIN}:host-gateway"
      - "psc.${BASE_DOMAIN}:host-gateway"
      - "auth.${BASE_DOMAIN}:host-gateway"
      - "files.${BASE_DOMAIN}:host-gateway"
      - "s3.${BASE_DOMAIN}:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 900s   # cold first-boot DB seed is ~10-15 min (verbose per-instance logging); keep container in "starting" so a one-pass `up` waits it out
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.4'
        reservations:
          memory: 128M
          cpus: '0.1'
    depends_on:
      pol-file-store:
        condition: service_healthy
#
  # ============================================
  # POLARI WWW — informational hub (static, low-load front door)
  # ============================================
  pol-hub:
    build:
      context: ./pol-hub
    container_name: pol-hub
    image: pol-hub:staging
    networks:
      - polari-network
    volumes:
      # Per-env project URLs (prf / dps / mesh / oseb), read by the site JS.
      - ./.generated/pol-hub-runtime-config.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.1'
        reservations:
          memory: 16M
          cpus: '0.02'

  # ============================================
  # ODOO ERP (business sims + real business ops)
  # ============================================

  # PostgreSQL for Odoo — the suite's FIRST postgres (Odoo requires it;
  # it does NOT reuse MariaDB). Profile 'odoo': NOT started by the
  # default suite up — bring up via `pol odoo up`; intended host is
  # econ-core (ODOO_INTEGRATION_PLAN.md od-0). Credentials:
  # pol-odoo-postgres/odoo-postgres.env (setup-polari-security.sh);
  # the password is BAKED into odoo-db-data at first init — same drift
  # class as mariadb.env (rescue: pol-odoo/README.md).
  odoo-postgres:
    profiles: ["odoo"]
    build:
      context: ./pol-odoo-postgres
      dockerfile: Dockerfile
    container_name: odoo-postgres
    image: pol-odoo-postgres:staging
    restart: always
    networks:
      - polari-network
    env_file:
      - ./pol-odoo-postgres/odoo-postgres.env
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Odoo 18 Community — ERP server, backbone of business SIMULATIONS
  # (odoo_sim DB) and REAL business ops (odoo_ops DB); the two must
  # never blur (ODOO_INTEGRATION_PLAN.md). Profile 'odoo': NOT started
  # by the default suite up — `pol odoo up`; intended host is econ-core
  # (od-0). Humans reach it at odoo.<domain> via pol-proxy (websocket
  # path /websocket -> :8072). Config pol-odoo/odoo.conf carries NO
  # secrets; DB creds come from pol-odoo/odoo.env (generated). DBs are
  # NOT auto-created — `pol odoo init-db <sim|ops>` after first up.
  odoo:
    profiles: ["odoo"]
    build:
      context: ./pol-odoo
      dockerfile: Dockerfile
    container_name: odoo
    image: pol-odoo:staging
    restart: always
    networks:
      - polari-network
    env_file:
      - ./pol-odoo/odoo.env
    volumes:
      - ./pol-odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-filestore:/var/lib/odoo
    depends_on:
      odoo-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8069/web/health', timeout=5).status==200 else 1)"]
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

# ============================================
# VOLUMES
# ============================================
volumes:
  pol_mariadb_data:
  pol_file_store_data:
  psc_redis_data:
  # PRF framework object DB (SQLite at /app/data) — persist across recreates.
  prf_backend_data:
  # Odoo ERP (profile 'odoo'): postgres data + filestore — mover-covered
  # subjects from day one (ODOO_INTEGRATION_PLAN.md od-6).
  odoo-db-data:
  odoo-filestore:

# ============================================
# NETWORKS
# ============================================
networks:
  polari-network:
    driver: bridge
