# ==============================================================================
# Polari Suite — Cert Manifest (declarative source of truth, per CENTRALIZED_CA_PLAN.md §10)
# ==============================================================================
# One declarative source that drives BOTH issuers:
#   - step-ca:      step ca certificate <cn> ... --san h1 --san h2 ...
#   - letsencrypt:  certbot certonly --dns-digitalocean -d h1 -d h2 ...
#
# Format (pipe-delimited, three columns):
#   cert-name | issuer | SANs
#
#   cert-name   identifier + output file basename (<cert-name>.crt / .key)
#   issuer      step-ca | letsencrypt
#   SANs        comma-separated explicit hostnames. NO WILDCARDS (§10).
#               The FIRST SAN is treated as the certificate CN.
#
# Lines beginning with '#' and blank lines are ignored. Whitespace around the
# pipes and around each SAN is trimmed by the parser in lib-ca-common.sh.
#
# Add a service => add a line here + re-issue. There is no implicit wildcard
# coverage — that is the intended posture (§10).
# ==============================================================================

# ---- Public edge (browser-facing): ONE cert, explicit SANs (§10), templated.
# issuer 'edge' resolves to letsencrypt where the env has a public edge (prod),
# else step-ca. SANs use ${BASE_DOMAIN}, filled per-env from the app's generated
# env (staging: NIP_DOMAIN=<IP>.nip.io ; prod: PROD_DOMAIN) — defined once, reused.
pol-proxy-public | edge | ${BASE_DOMAIN}, www.${BASE_DOMAIN}, auth.${BASE_DOMAIN}, prf.${BASE_DOMAIN}, psc.${BASE_DOMAIN}, api.prf.${BASE_DOMAIN}, api.psc.${BASE_DOMAIN}, files.${BASE_DOMAIN}, s3.${BASE_DOMAIN}

# ---- Internal plane (per-service step-ca certs, scoped to own hostname(s)) ----
pol-kc       | step-ca | pol-keycloak, keycloak.internal
pol-proxy    | step-ca | pol-proxy, pol-file-store
prf-proxy    | step-ca | prf-proxy
prf-backend  | step-ca | prf-backend.internal
prf-kc       | step-ca | prf-keycloak
psc-proxy    | step-ca | psc-proxy
psc-backend  | step-ca | psc-backend.internal
