# Serves the static Polari hub. Mirrors the suite frontends: port 4200, a /health
# probe, SPA-agnostic static routing. TLS + hostname routing live at pol-proxy.
worker_processes auto;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/css application/javascript image/svg+xml application/json;

  server {
    listen 4200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /health { add_header Content-Type application/json; return 200 '{"status":"ok"}'; }

    # Hashed/static assets cached hard; documents kept fresh.
    location ~* \.(css|js|png|jpe?g|svg|webp|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /docs.html  { add_header Cache-Control "no-store"; }

    location / { try_files $uri $uri/ =404; }
  }
}
