# ==============================================================================
# POLARI SUITE - STAGING LOCAL (port-based routing overlay)
# ==============================================================================
#
# Purpose: Test production builds locally without DNS setup
# Uses: Production Dockerfiles + Resource limits + Dev proxy (port-based routing)
# 
# This is an OVERLAY file - use with base docker-compose.yml:
#
# USAGE:
#   sudo docker compose -f docker-compose.yml -f docker-compose.staging-local.yml up -d --build
#
# ACCESS (same ports as dev mode):
#   - PSC Frontend:    https://localhost:2053
#   - PSC Backend API: https://localhost:2083
#   - PRF Frontend:    https://localhost:2087
#   - PRF Backend API: https://localhost:2096
#   - Keycloak Auth:   https://localhost:8443
#
# ==============================================================================

services:
  # ============================================
  # SHARED DATABASE SERVICES
  # ============================================

  pol-mariadb:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-file-size=32M
      --max-connections=50
      --query-cache-size=0
      --tmp-table-size=16M
      --max-heap-table-size=16M

  psc-redis:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.05'
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru

  # ============================================
  # PROXY (inherits from base, just adds resource limits)
  # ============================================

  pol-proxy:
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'

  # ============================================
  # AUTHENTICATION SERVICES
  # ============================================

  pol-keycloak:
    environment:
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.net.preferIPv4Stack=true
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.2'

  # ============================================
  # POLITICAL SCORECARD (PSC) SERVICES
  # ============================================

  psc-frontend:
    build:
      context: ./political-scorecard-node/political-scorecard-frontend
      dockerfile: Dockerfile.prod
    image: psc-frontend:staging-local
    volumes: []
    command: []
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'

  psc-backend:
    build:
      context: ./political-scorecard-node/political-scorecard-backend
      dockerfile: Dockerfile.prod
    image: psc-backend:staging-local
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://pol-mariadb:3306/psc
      - SPRING_DATASOURCE_USERNAME=psc-scorecard-server
      - SPRING_DATASOURCE_PASSWORD=pscpassword
      - SPRING_PROFILES_ACTIVE=prod
      - APP_CORS_ALLOWED_ORIGINS=https://localhost:2053,http://localhost:4200,https://localhost:4200
      - JAVA_OPTS=-Xms128m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # ============================================
  # POLARI RESEARCH FRAMEWORK (PRF) SERVICES
  # ============================================

  prf-frontend:
    build:
      context: ./polari-rf-node/polari-platform-angular
      dockerfile: Dockerfile.prod
    image: prf-frontend:staging-local
    volumes: []
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.05'

  prf-backend:
    environment:
      # Use development for CORS (allows localhost origins)
      - DEPLOY_ENV=development
      # Explicit CORS origins for staging-local testing
      - CORS_ORIGINS=https://localhost:2087,https://localhost:2053,http://localhost:4200,http://localhost:4201
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.4'
        reservations:
          memory: 128M
          cpus: '0.1'
