events { worker_connections 1024; }

http {
    include mime.types;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;
    error_log /dev/stderr debug;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Upstream definitions - internal container names
    # Use HTTP for internal container communication (Docker network is isolated)
    upstream keycloak {
        server pol-keycloak:8080;
    }

    upstream psc-frontend {
        server psc-frontend:4200;
    }

    upstream psc-backend {
        server psc-backend:8080;
    }

    upstream prf-frontend {
        server prf-frontend:4200;
    }

    upstream prf-backend {
        server prf-backend:3000;
    }

    # ============================================
    # DEV MODE - Cloudflare-compatible HTTPS ports
    # Cloudflare HTTPS ports: 443, 2053, 2083, 2087, 2096, 8443
    # ============================================

    # Default HTTPS (443) - redirect to PSC Frontend on 2053
    # This allows users to simply use "https://localhost" without specifying a port
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect to the primary application (PSC Frontend)
        location / {
            return 302 https://localhost:2053$request_uri;
        }
    }

    # Keycloak Auth - localhost:8443
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }

    # PSC Frontend - localhost:2053
    server {
        listen 2053 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://psc-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Angular dev server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # PSC Backend API - localhost:2083
    server {
        listen 2083 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        # Certificate trust landing page - shown when browser navigates directly
        location = /cert-trust {
            default_type text/html;
            return 200 '<!DOCTYPE html><html><head><title>Certificate Trusted</title></head><body style="font-family:sans-serif;padding:40px;text-align:center"><h1>PSC Backend API</h1><p>Certificate is now trusted by your browser.</p><p>You can close this tab and return to the application.</p></body></html>';
        }

        location / {
            proxy_pass http://psc-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # PRF Frontend - localhost:2087
    server {
        listen 2087 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://prf-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Angular dev server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # PRF Backend API - localhost:2096
    server {
        listen 2096 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        # Certificate trust landing page - shown when browser navigates directly
        location = /cert-trust {
            default_type text/html;
            return 200 '<!DOCTYPE html><html><head><title>Certificate Trusted</title></head><body style="font-family:sans-serif;padding:40px;text-align:center"><h1>PRF Backend API</h1><p>Certificate is now trusted by your browser.</p><p>You can close this tab and return to the application.</p></body></html>';
        }

        location / {
            proxy_pass http://prf-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
