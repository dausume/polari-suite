events { worker_connections 1024; }

http {
    include mime.types;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;
    error_log /dev/stderr debug;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Docker embedded DNS — required for variable proxy_pass resolution
    resolver 127.0.0.11 valid=30s;

    # Detect WebSocket upgrade requests at the protocol level.
    # When a client sends "Upgrade: websocket", nginx routes to the STOMP
    # server automatically — no dedicated /ws/ path needed.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # PRF backend routing: WebSocket upgrades → STOMP (3001), everything else → API (3000)
    map $http_upgrade $prf_api_target {
        default     http://prf-backend:3000;
        ~*websocket http://prf-backend:3001;
    }

    # Upstream definitions - internal container names
    # Use HTTP for internal container communication (Docker network is isolated)
    upstream keycloak {
        server pol-keycloak:8080;
    }

    upstream psc-frontend {
        server psc-frontend:4200;
    }

    upstream psc-backend {
        server psc-backend:8080;
    }

    upstream prf-frontend {
        server prf-frontend:4200;
    }

    upstream prf-backend {
        server prf-backend:3000;
    }

    # ============================================
    # DEV MODE - Cloudflare-compatible HTTPS ports
    # Cloudflare HTTPS ports: 443, 2053, 2083, 2087, 2096, 8443
    # ============================================

    # Default HTTPS (443) - redirect to PSC Frontend on 2053
    # WebSocket upgrades on this port route to STOMP server automatically
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect regular HTTP to the primary application (PSC Frontend)
        # WebSocket upgrade requests are routed to STOMP via $prf_api_target
        location / {
            # WebSocket upgrade → STOMP server; regular HTTP → redirect
            proxy_pass $prf_api_target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;

            # For non-WebSocket requests, redirect to PSC Frontend
            if ($http_upgrade = '') {
                return 302 https://localhost:2053$request_uri;
            }
        }
    }

    # Keycloak Auth - localhost:8443
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }

    # PSC Frontend - localhost:2053
    server {
        listen 2053 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://psc-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Angular dev server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # PSC Backend API - localhost:2083
    server {
        listen 2083 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        # Certificate trust landing page - shown when browser navigates directly
        location = /cert-trust {
            default_type text/html;
            return 200 '<!DOCTYPE html><html><head><title>Certificate Trusted</title></head><body style="font-family:sans-serif;padding:40px;text-align:center"><h1>PSC Backend API</h1><p>Certificate is now trusted by your browser.</p><p>You can close this tab and return to the application.</p></body></html>';
        }

        location / {
            proxy_pass http://psc-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # PRF Frontend - localhost:2087
    server {
        listen 2087 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://prf-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Angular dev server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # PRF Backend API - localhost:2096
    server {
        listen 2096 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Redirect HTTP requests sent to HTTPS port
        error_page 497 =301 https://$host:$server_port$request_uri;

        # Certificate trust landing page - shown when browser navigates directly
        location = /cert-trust {
            default_type text/html;
            return 200 '<!DOCTYPE html><html><head><title>Certificate Trusted</title></head><body style="font-family:sans-serif;padding:40px;text-align:center"><h1>PRF Backend API</h1><p>Certificate is now trusted by your browser.</p><p>You can close this tab and return to the application.</p></body></html>';
        }

        # Protocol-based routing: WebSocket upgrades → STOMP (3001), HTTP → API (3000)
        location / {
            proxy_pass $prf_api_target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
