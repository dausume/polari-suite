events { worker_connections 1024; }

http {
    include mime.types;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    # Upstream definitions
    upstream keycloak {
        server pol-keycloak:8443;
    }

    upstream psc-frontend {
        server psc-frontend:4200;
    }

    upstream psc-backend {
        server psc-backend:8080;
    }

    upstream prf-frontend {
        server prf-frontend:4200;
    }

    upstream prf-backend {
        server prf-backend:3000;
    }

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name *.polari-systems.org polari-systems.org;
        return 301 https://$host$request_uri;
    }

    # Landing page - polari-systems.org
    server {
        listen 443 ssl;
        server_name polari-systems.org www.polari-systems.org;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        location / {
            # TODO: Configure landing page service or static files
            return 200 'Polari Systems - Coming Soon';
            add_header Content-Type text/plain;
        }
    }

    # Keycloak Auth - auth.polari-systems.org
    server {
        listen 443 ssl;
        server_name auth.polari-systems.org;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        location / {
            proxy_pass https://keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # mTLS to Keycloak
            proxy_ssl_verify on;
            proxy_ssl_name pol-keycloak;
            proxy_ssl_trusted_certificate /etc/nginx/certs/ca/pol-ca.crt;
            proxy_ssl_certificate /etc/nginx/certs/pol-proxy.crt;
            proxy_ssl_certificate_key /etc/nginx/certs/pol-proxy.key;
        }
    }

    # PSC Frontend - psc.polari-systems.org
    server {
        listen 443 ssl;
        server_name psc.polari-systems.org;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        location / {
            proxy_pass http://psc-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for dev server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # PSC Backend API - api.psc.polari-systems.org
    server {
        listen 443 ssl;
        server_name api.psc.polari-systems.org;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Health check endpoint
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"psc-backend-proxy"}';
        }

        location / {
            proxy_pass http://psc-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }

    # PRF Frontend - prf.polari-systems.org
    server {
        listen 443 ssl;
        server_name prf.polari-systems.org;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        location / {
            proxy_pass http://prf-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for dev server
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # PRF Backend API - api.prf.polari-systems.org
    server {
        listen 443 ssl;
        server_name api.prf.polari-systems.org;

        ssl_certificate /etc/nginx/certs/pol-proxy.crt;
        ssl_certificate_key /etc/nginx/certs/pol-proxy.key;

        # Health check endpoint
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"prf-backend-proxy"}';
        }

        location / {
            # CORS headers
            add_header Access-Control-Allow-Origin "https://prf.polari-systems.org" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            add_header Access-Control-Allow-Credentials "true" always;

            # Handle preflight OPTIONS requests
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://prf-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }
    }
}
