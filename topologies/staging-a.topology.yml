# ============================================================
# PORTABLE POLARI TOPOLOGY PACKAGE — credential-free by
# construction (secrets self-generate on every target).
# Re-deploy anywhere: pol topology push <this file>, then
# pol topology apply (top-3/4). Safe to commit/share.
# ============================================================
schema_version: '1'
kind: polari-topology-package
topology:
  name: staging-a
  description: "Current reality: combined prf+psc compose suite, twin-b + dask compose\
    \ projects, and the polari-engines swarm stack \u2014 all on the staging-a host."
  default_target: compose
  status: applied
  schema_version: '1'
  notes: Seeded by top-1 to mirror the live 2026-07-09 deployment; becomes the first
    portable package (topologies/staging-a.topology.yml, top-3).
machines:
- name: isle-core
  ssh_alias: isle-core
  arch: x86_64
  mem_gb: 7.6
  roles_json: '["engines", "remote-worker", "node"]'
  swarm_role: none
  repo_dir: ~/polari-suite
  source: nodes.yml
  notes: "ISLE-MESH/infra/hardware-integration core \u2014 science engines; runs its\
    \ own Claude (Isle-Mesh project)"
- name: pol-core
  ssh_alias: ''
  arch: x86_64
  mem_gb: 0.0
  roles_json: '["node","research-core"]'
  swarm_role: manager
  repo_dir: ~/Desktop/polari-suite
  source: nodes.yml
  notes: "RESEARCH/Polari core (renamed from staging-a 2026-07-27) \u2014 node stack\
    \ lives here"
instances:
- name: engines
  kind: worker
  service_kinds_json: '["prf-msci-engines"]'
  replicas: 1
  env_tier: staging
  machine_name: isle-core
  placement_constraint: ''
  db_backend: sqlite
  image_tag: staging
  orchestration_target: swarm
  topology_name: staging-a
  notes: "The polari-engines swarm stack (:9500) \u2014 FEM/DFT compute workers, deployed\
    \ via `pol swarm deploy engines` (single-node swarm today)."
- name: prf-a
  kind: prf
  service_kinds_json: '["prf-backend", "prf-frontend"]'
  replicas: 1
  env_tier: staging
  machine_name: pol-core
  placement_constraint: node.labels.polari.machine == pol-core
  db_backend: sqlite
  image_tag: staging
  orchestration_target: compose
  topology_name: staging-a
  notes: The CORE Polari instance (research framework). In the combined suite it shares
    the shared-infra pol-* services; standalone rf-node bundles add prf-mariadb/prf-keycloak/prf-file-store/prf-proxy.
    db_backend flips to mariadb+keydb via the dbcombo overlay (`pol db`).
- name: prf-b
  kind: prf
  service_kinds_json: '["prf-backend-b", "prf-frontend-b", "prf-keydb-b"]'
  replicas: 1
  env_tier: staging
  machine_name: pol-core
  placement_constraint: node.labels.polari.machine == pol-core
  db_backend: sqlite
  image_tag: staging
  orchestration_target: compose
  topology_name: staging-a
  notes: "Twin CHILD instance \u2014 reuses A's images + shared infra, own identity\
    \ (POLARI_INSTANCE_ID=b), admitted via PeerAgreement (ports 8081/8083)."
- name: prf-dask
  kind: worker
  service_kinds_json: '["prf-dask"]'
  replicas: 1
  env_tier: staging
  machine_name: pol-core
  placement_constraint: node.labels.polari.machine == pol-core
  db_backend: sqlite
  image_tag: staging
  orchestration_target: compose
  topology_name: staging-a
  notes: Dask parallel-search workers (6x speedup proven; cross-instance 5/5 split
    proven).
- name: psc-a
  kind: psc
  service_kinds_json: '["psc-backend", "psc-frontend", "psc-redis"]'
  replicas: 1
  env_tier: staging
  machine_name: pol-core
  placement_constraint: node.labels.polari.machine == pol-core
  db_backend: mariadb
  image_tag: staging
  orchestration_target: compose
  topology_name: staging-a
  notes: Political Scorecard instance (backend/frontend/redis); its mariadb/keycloak/minio
    live on shared-infra.
- name: shared-infra
  kind: infra
  service_kinds_json: '["pol-mariadb", "pol-keycloak", "pol-file-store", "pol-proxy"]'
  replicas: 1
  env_tier: staging
  machine_name: pol-core
  placement_constraint: node.labels.polari.machine == pol-core
  db_backend: mariadb
  image_tag: staging
  orchestration_target: compose
  topology_name: staging-a
  notes: 'The combined suite''s shared infrastructure: mariadb + keycloak + minio
    + the TLS-terminating nginx proxy.'
assignments:
- name: aquaponics@prf-a
  module_name: aquaponics
  instance_name: prf-a
  state: enabled
  topology_name: staging-a
  notes: Self-watering pot sim (aqp-1..6).
- name: materialsScience.dft@engines
  module_name: materialsScience.dft
  instance_name: engines
  state: enabled
  topology_name: staging-a
  notes: DFT engine capability on the engines worker.
- name: materialsScience.fem@engines
  module_name: materialsScience.fem
  instance_name: engines
  state: enabled
  topology_name: staging-a
  notes: FEM engine capability on the engines worker.
- name: materialsScience.multiscale@prf-a
  module_name: materialsScience.multiscale
  instance_name: prf-a
  state: enabled
  topology_name: staging-a
  notes: "Multi-scale models (wax-multiscale) \u2014 the consumer of fem + dft in\
    \ the seed demo."
- name: materialsScience@prf-a
  module_name: materialsScience
  instance_name: prf-a
  state: enabled
  topology_name: staging-a
  notes: Materials basis + engine-model layer (msci-0..24).
- name: scorecard@psc-a
  module_name: scorecard
  instance_name: psc-a
  state: enabled
  topology_name: staging-a
  notes: Political Scorecard app (scr-7 seam consumes prf's scoring API).
- name: scoring@prf-a
  module_name: scoring
  instance_name: prf-a
  state: enabled
  topology_name: staging-a
  notes: Context scoring (scr-1..16).
- name: simulations@prf-a
  module_name: simulations
  instance_name: prf-a
  state: enabled
  topology_name: staging-a
  notes: Multi-scale simulation framework.
edges:
- name: materialsScience.multiscale@prf-a->materialsScience.dft
  module_name: materialsScience.multiscale
  consumer_instance_name: prf-a
  depends_on_module: materialsScience.dft
  provider_instance_name: engines
  status: resolved
  topology_name: staging-a
  notes: "Multiscale DFT delegation \u2014 same seam as fem."
- name: materialsScience.multiscale@prf-a->materialsScience.fem
  module_name: materialsScience.multiscale
  consumer_instance_name: prf-a
  depends_on_module: materialsScience.fem
  provider_instance_name: engines
  status: resolved
  topology_name: staging-a
  notes: "Multiscale FEM delegation \u2014 MSCI_ENGINES_URL seam today, registry-resolved\
    \ routing in top-7."
connections:
- name: pol-proxy->psc-frontend:nginx-proxy-config
  interconnect_key: nginx-proxy-config
  from_kind: pol-proxy
  to_kind: psc-frontend
  from_instance_name: shared-infra
  to_instance_name: psc-a
  artifact: .generated/nginx.staging.conf (suite)
  topology_name: staging-a
  notes: suite-side subdomain routing + TLS termination.
- name: prf-backend->prf-file-store:minio-credentials
  interconnect_key: minio-credentials
  from_kind: prf-backend
  to_kind: prf-file-store
  from_instance_name: prf-a
  to_instance_name: prf-a
  artifact: rf-node knobs POLARI_MINIO_ROOT_USER/_PASS
  topology_name: staging-a
  notes: object-storage client -> minio root.
- name: prf-backend->prf-keycloak:keycloak-client-secrets
  interconnect_key: keycloak-client-secrets
  from_kind: prf-backend
  to_kind: prf-keycloak
  from_instance_name: prf-a
  to_instance_name: prf-a
  artifact: polari-rf-node/prf-keycloak/prf-keycloak-admin.env
  topology_name: staging-a
  notes: backend service-account -> keycloak admin API.
- name: prf-backend->prf-mariadb:db-credentials
  interconnect_key: db-credentials
  from_kind: prf-backend
  to_kind: prf-mariadb
  from_instance_name: prf-a
  to_instance_name: prf-a
  artifact: polari-rf-node/prf-mariadb/mariadb.env
  topology_name: staging-a
  notes: DB users, volume-baked at first init (dbcombo path).
- name: prf-backend-b->prf-backend:peer-token
  interconnect_key: peer-token
  from_kind: prf-backend-b
  to_kind: prf-backend
  from_instance_name: prf-b
  to_instance_name: prf-a
  artifact: polari-rf-node/.generated/.polari-peer-token
  topology_name: staging-a
  notes: instance<->instance peer trust; admission flow = PeerAgreement (polariPeers/).
- name: prf-frontend->prf-backend:prf-runtime-config
  interconnect_key: prf-runtime-config
  from_kind: prf-frontend
  to_kind: prf-backend
  from_instance_name: prf-a
  to_instance_name: prf-a
  artifact: .generated/prf-runtime-config*.json
  topology_name: staging-a
  notes: frontend -> its backend + keycloak issuer.
- name: prf-frontend-b->prf-backend-b:twin-runtime-config
  interconnect_key: twin-runtime-config
  from_kind: prf-frontend-b
  to_kind: prf-backend-b
  from_instance_name: prf-b
  to_instance_name: prf-b
  artifact: polari-rf-node/.generated/prf-b-runtime-config.json
  topology_name: staging-a
  notes: instance-B frontend -> instance-B backend (ports 8081/8083).
- name: prf-proxy->prf-frontend:nginx-proxy-config
  interconnect_key: nginx-proxy-config
  from_kind: prf-proxy
  to_kind: prf-frontend
  from_instance_name: prf-a
  to_instance_name: prf-a
  artifact: .generated/nginx.staging.conf (rf-node)
  topology_name: staging-a
  notes: subdomain routing + TLS termination (pol proxy render|check|promote).
- name: psc-backend->pol-keycloak:keycloak-client-secrets
  interconnect_key: keycloak-client-secrets
  from_kind: psc-backend
  to_kind: pol-keycloak
  from_instance_name: psc-a
  to_instance_name: shared-infra
  artifact: pol-keycloak/keycloak-admin.env
  topology_name: staging-a
  notes: psc service-account -> keycloak admin API.
- name: psc-backend->pol-mariadb:db-credentials
  interconnect_key: db-credentials
  from_kind: psc-backend
  to_kind: pol-mariadb
  from_instance_name: psc-a
  to_instance_name: shared-infra
  artifact: pol-mariadb/mariadb.env
  topology_name: staging-a
  notes: psc-scorecard-server DB user, volume-baked.
- name: psc-backend->prf-backend:scorecard-api-seam
  interconnect_key: scorecard-api-seam
  from_kind: psc-backend
  to_kind: prf-backend
  from_instance_name: psc-a
  to_instance_name: prf-a
  artifact: (scr-7, designed not built)
  topology_name: staging-a
  notes: "psc consumes prf's /api/scoring instead of its own mocks \u2014 designed,\
    \ not built (scr-7)."
- name: psc-frontend->psc-backend:psc-runtime-config
  interconnect_key: psc-runtime-config
  from_kind: psc-frontend
  to_kind: psc-backend
  from_instance_name: psc-a
  to_instance_name: psc-a
  artifact: .generated/psc-runtime-config.json
  topology_name: staging-a
  notes: psc frontend -> psc backend + keycloak realm.
