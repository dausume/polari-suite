# ============================================================
# PORTABLE POLARI TOPOLOGY PACKAGE — credential-free by
# construction (secrets self-generate on every target).
# Re-deploy anywhere: pol topology push <this file>, then
# pol topology apply (top-3/4). Safe to commit/share.
# ============================================================
schema_version: '1'
kind: polari-topology-package
topology:
  name: staging-a
  description: "Current reality: combined prf+psc compose suite, twin-b + dask compose\
    \ projects, and the polari-engines swarm stack \u2014 all on the staging-a host."
  default_target: compose
  status: applied
  schema_version: '1'
  notes: Seeded by top-1 to mirror the live 2026-07-09 deployment; becomes the first
    portable package (topologies/staging-a.topology.yml, top-3).
machines:
- name: econ-core
  ssh_alias: econ-core
  arch: x86_64
  mem_gb: 7.5
  roles_json: '["engines", "remote-worker", "business-ops", "economics"]'
  swarm_role: none
  repo_dir: ~/polari-suite
  source: nodes.yml
  notes: "N95 4-core / 7.5G; suspend disabled 2026-07-08 \u2014 safe headless target.\
    \ Business-ops/economics core; Odoo + odoo-postgres land here (ODOO_INTEGRATION_PLAN.md)."
- name: isle-core
  ssh_alias: isle-core
  arch: x86_64
  mem_gb: 7.6
  roles_json: '["engines", "remote-worker", "node"]'
  swarm_role: worker
  repo_dir: ~/polari-suite
  source: nodes.yml
  notes: 6-core i5 / 7.6G; also runs the Isle-Mesh project. system_info_url -> the
    cad-engines service pinned here.
- name: staging-a
  ssh_alias: ''
  arch: x86_64
  mem_gb: 15.51
  roles_json: '["core", "suite", "swarm-manager"]'
  swarm_role: manager
  repo_dir: ~/Desktop/polari-suite
  source: manual
  notes: "Local staging host (192.168.0.210) \u2014 combined compose suite + single-node\
    \ swarm (polari-engines stack) + twin/dask compose projects."
instances:
- name: board-engines
  kind: worker
  service_kinds_json: '["prf-board-engines"]'
  replicas: 1
  env_tier: staging
  machine_name: isle-core
  placement_constraint: ''
  db_backend: sqlite
  cache_backend: ''
  blob_backend: ''
  image_tag: staging
  orchestration_target: swarm
  topology_name: staging-a
  notes: "The board (avr family) toolchain worker (:9830, brd-1/sc-3) — avr-gcc\
    \ / avr-objcopy / avr-size / avrdude / simavr / the avr-twin harness, image\
    \ prf-board-engines:trixie (id 155516d7589f, 535 MB), on a swarm worker pinned\
    \ to isle-core (`docker-compose.hw-engines.yml`, `node.labels.polari.machine\
    \ == isle-core`); mem cap 512m. Started 2026-10-03 as a plain `docker run --restart\
    \ unless-stopped --memory 512m` container on isle-core (ENGINES-ON-ISLE-CORE.md),\
    \ then bound into this topology + the swarm (2026-10-03, his point: Polari should\
    \ already be capable of bundling two devices together via setup from the CLI) so\
    \ modules/board/custom/board_engines.py resolves it with NO env knobs. LIMIT: the\
    \ avr-twin (a long-lived simavr TCP port) refuses on a remote rung by design\
    \ (board/custom/twin.py) — twin probes must run ON isle-core itself (`ssh\
    \ isle-core`, a checkout there); nodes.yml already names isle-core for the\
    \ hardware-integration role, `pol deploy` has no twin-specific verb yet (owed)."
- name: cnt-engines
  kind: worker
  service_kinds_json: '["prf-cnt-engines"]'
  replicas: 1
  env_tier: staging
  machine_name: isle-core
  placement_constraint: ''
  db_backend: sqlite
  cache_backend: null
  blob_backend: null
  image_tag: staging
  orchestration_target: swarm
  topology_name: staging-a
  notes: "The polari-cnt-engines swarm stack (:9700) \u2014 the cntfet module's compute\
    \ (OSDI equivalence, cell characterization, D11, F3 NEGF) on a worker node; `pol\
    \ swarm deploy cnt-engines`."
- name: eda-engines
  kind: worker
  service_kinds_json: '["prf-eda-engines"]'
  replicas: 1
  env_tier: staging
  machine_name: staging-a
  placement_constraint: ''
  db_backend: sqlite
  cache_backend: ''
  blob_backend: ''
  image_tag: staging
  orchestration_target: compose
  topology_name: staging-a
  notes: "The polari-eda-tools worker (:9800) \u2014 magic / netgen / OpenSTA / yosys\
    \ / iverilog / riscv-gcc for computelod lod-1..3c; `docker compose -p eda-engines\
    \ -f docker-compose.eda-engines.yml up -d` from polari-rf-node; holds the PDK\
    \ volume (never in git). Cost: image 2.56 GB (rc-1 profile prf-eda-engines)."
- name: engines
  kind: worker
  service_kinds_json: '["prf-msci-engines"]'
  replicas: 1
  env_tier: staging
  machine_name: staging-a
  placement_constraint: ''
  db_backend: sqlite
  cache_backend: null
  blob_backend: null
  image_tag: staging
  orchestration_target: swarm
  topology_name: staging-a
  notes: "The polari-engines swarm stack (:9500) \u2014 FEM/DFT compute workers, deployed\
    \ via `pol swarm deploy engines` (single-node swarm today)."
- name: esp-engines
  kind: worker
  service_kinds_json: '["prf-esp-engines"]'
  replicas: 1
  env_tier: staging
  machine_name: isle-core
  placement_constraint: ''
  db_backend: sqlite
  cache_backend: ''
  blob_backend: ''
  image_tag: staging
  orchestration_target: swarm
  topology_name: staging-a
  notes: "The board ESP32-C3 family worker (:9850, sc-3) \u2014 idf-build / c3-run\
    \ (QEMU) / esptool / riscv32-esp-elf-nm, image prf-esp-engines:noble (id 8e8ad8f64e85,\
    \ 1.81 GB), on a swarm worker pinned to isle-core (`docker-compose.hw-engines.yml`,\
    \ `node.labels.polari.machine == isle-core`); mem cap 2048m. Started 2026-10-03\
    \ as a plain `docker run --restart unless-stopped --memory 2048m` container on\
    \ isle-core (ENGINES-ON-ISLE-CORE.md), then bound into this topology + the swarm\
    \ so modules/board/custom/board_engines.py's esp family resolves it with NO env\
    \ knobs. GAP (found, not fixed here): the running home core's topology.provider_registry.PROVIDER_PORTS\
    \ carries no prf-esp-engines:9850 entry (present on dev-sc-3/dev-hn-0, absent on\
    \ the deployed image's line) \u2014 until that port lands, this instance's URL\
    \ cannot be built even once the module assignment resolves; see the suite handoff\
    \ for the offline proof. LIMIT: the c3-run twin is a long-lived QEMU process \u2014\
    \ refuses on a remote rung by design; twin probes run ON isle-core."
- name: formal-engines
  kind: worker
  service_kinds_json: '["prf-formal-engines"]'
  replicas: 1
  env_tier: staging
  machine_name: isle-core
  placement_constraint: ''
  db_backend: sqlite
  cache_backend: ''
  blob_backend: ''
  image_tag: staging
  orchestration_target: swarm
  topology_name: staging-a
  notes: "The firmware formal + static engines worker (:9840, sc-2b/sc-2c) \u2014\
    \ CBMC / cppcheck / Frama-C 33 + Mthread, image prf-formal-engines:trixie (id\
    \ 24e37129cc7a, 594 MB), on a swarm worker pinned to isle-core (`docker-compose.hw-engines.yml`,\
    \ `node.labels.polari.machine == isle-core`); mem cap 1024m. Started 2026-10-03\
    \ as a plain `docker run --restart unless-stopped --memory 1024m` container on\
    \ isle-core (ENGINES-ON-ISLE-CORE.md), then bound into this topology + the swarm\
    \ so modules/firmwarefaults/custom/formal_engines.py resolves it with NO env knobs.\
    \ No twin/placement limit here \u2014 every engine is a one-shot /run request."
- name: livekit
  kind: worker
  service_kinds_json: '["pol-livekit"]'
  replicas: 1
  env_tier: staging
  machine_name: staging-a
  placement_constraint: ''
  db_backend: sqlite
