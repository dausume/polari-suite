  state: enabled
  topology_name: staging-a
  notes: Self-watering pot sim (aqp-1..6).
- name: board.engines@board-engines
  module_name: board.engines
  instance_name: board-engines
  state: enabled
  topology_name: staging-a
  notes: "brd-1/sc-3: the board (avr family) engine capability (avr-gcc/avrdude/simavr/avr-twin)\
    \ on the board-engines worker — the provider modules/board/custom/board_engines.py\
    \ resolves when BOARD_ENGINES_URL is unset and no local binary/image exists;\
    \ `pol allocate board.engines board-engines`. Bound 2026-10-03 — no env knob\
    \ needed on the home core once the board module ships there (it does not yet;\
    \ see the edge note)."
- name: board.esp-engines@esp-engines
  module_name: board.esp-engines
  instance_name: esp-engines
  state: enabled
  topology_name: staging-a
  notes: "sc-3: the board ESP32-C3 family's engine capability (idf-build/c3-run/esptool)\
    \ on the esp-engines worker — resolved when ESP_ENGINES_URL is unset and no\
    \ local binary/image exists; `pol allocate board.esp-engines esp-engines`. Bound\
    \ 2026-10-03; see the esp-engines instance notes for the PROVIDER_PORTS gap on\
    \ the home core's current image."
