edges:
- name: board@prf-a->board.engines
  module_name: board
  consumer_instance_name: prf-a
  depends_on_module: board.engines
  provider_instance_name: board-engines
  status: unresolved
  topology_name: staging-a
  notes: "BOARD_ENGINES_URL knob wins, else a local binary, else the local prf-board-engines\
    \ image, else this edge (live providers only), else refusal naming the knob.\
    \ status=unresolved (not 'resolved'): verified directly against isle-core's\
    \ :9830/capability (ENGINES-ON-ISLE-CORE.md) and offline against these rows\
    \ (a fake topology answering them, like board_engines.py's own selftest) —\
    \ never yet via THIS core's live resolver, because the deployed prf-backend\
    \ image predates the board module (no modules/board/ in /app/modules, no\
    \ prf-board-engines in topology.provider_registry.PROVIDER_PORTS)."
- name: board@prf-a->board.esp-engines
  module_name: board
  consumer_instance_name: prf-a
  depends_on_module: board.esp-engines
  provider_instance_name: esp-engines
  status: unresolved
  topology_name: staging-a
  notes: "ESP_ENGINES_URL knob wins, else a local binary, else the local prf-esp-engines\
    \ image, else this edge (live providers only), else refusal naming the knob.\
    \ status=unresolved for the same reason as board.engines above, PLUS a second\
    \ gap: even with the board module present, the deployed image's\
    \ topology.provider_registry.PROVIDER_PORTS has no prf-esp-engines:9850 entry\
    \ (present on dev-sc-3/dev-hn-0) — _instance_url refuses with 'carries no\
    \ known provider service kind' until that lands too."
- name: cntfet@prf-a->cntfet.engines
  module_name: cntfet
  consumer_instance_name: prf-a
  depends_on_module: cntfet.engines
  provider_instance_name: cnt-engines
