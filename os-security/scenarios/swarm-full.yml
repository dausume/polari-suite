# os-security scenario: the FULL production stack (pol prod, logins=keycloak; docker-compose.prod.yml).
name: swarm-full
rings: [dac, mac, network, host]
tier: member
mode: enforce
fixed_mode: enforce

docker:
  userns_remap: ""
  no_new_privileges: true
  icc: false
  networks: [polari-network]
  overlay_encrypted: true

allow_to_host:
  - { proto: udp, port: 53,  why: "DNS" }
  - { proto: tcp, port: 53,  why: "DNS" }
deny_to_host_ports: [22, 2375, 2376, 2377, 7946, 4789, 16509, 8080, 50000]

ufw:
  enabled: true
  default_incoming: deny
  allow:
    - { port: 22,   proto: tcp, from: "admin-lan", why: "ssh from the operator's network only" }
    - { port: 80,   proto: tcp, from: "any",       why: "ACME + redirect" }
    - { port: 443,  proto: tcp, from: "any",       why: "the edge (11 names, one certificate)" }
    - { port: 2377, proto: tcp, from: "swarm",     why: "swarm management (peers only)" }
    - { port: 7946, proto: any, from: "swarm",     why: "swarm gossip (peers only)" }
    - { port: 4789, proto: udp, from: "swarm",     why: "overlay VXLAN (peers only)" }

fixed:
  - { name: pol-proxy,      profile: gateway, image: nginx:1.27-alpine, writable: ["/var/cache/nginx", "/var/run"], network: [isle, internet], capabilities: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID], ports: [80, 443] }
  - { name: pol-hub,        profile: web-app, image: pol-hub, writable: ["/var/cache/nginx", "/var/run"], network: [isle], capabilities: [CHOWN, SETUID, SETGID], ports: [4200] }
  - { name: prf-frontend,   profile: web-app, image: prf-frontend, writable: ["/var/cache/nginx", "/var/run"], network: [isle], capabilities: [CHOWN, SETUID, SETGID], ports: [4200] }
  - { name: psc-frontend,   profile: web-app, image: psc-frontend, writable: ["/var/cache/nginx", "/var/run"], network: [isle], capabilities: [CHOWN, SETUID, SETGID], ports: [4200] }
  - { name: prf-backend,    profile: worker,  image: prf-backend, writable: ["/app/data", "/tmp"], network: [isle, internet], capabilities: [], ports: [3000, 3001] }
  - { name: psc-backend,    profile: worker,  image: psc-backend, writable: ["/tmp"], network: [isle], capabilities: [], ports: [8080] }
  - { name: pol-keycloak,   profile: worker,  image: pol-keycloak, writable: ["/opt/keycloak/data", "/tmp"], network: [isle], capabilities: [], ports: [8080, 8443] }
  - { name: pol-mariadb,    profile: worker,  image: pol-mariadb, writable: ["/var/lib/mysql", "/run/mysqld", "/tmp"], network: [isle], capabilities: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH], ports: [3306] }
  - { name: pol-file-store, profile: worker,  image: pol-file-store, writable: ["/data", "/tmp"], network: [isle], capabilities: [], ports: [9000, 9001] }
  - { name: psc-redis,      profile: worker,  image: psc-redis, writable: ["/data"], network: [isle], capabilities: [], ports: [6379] }

host:
  sysctl: true
  auditd: true
  unattended_upgrades: true
  perms:
    - { path: .generated/certs/edge,   owner: root, group: root, mode: "0700" }
    - { path: .generated/.env.prod,    owner: root, group: root, mode: "0600" }
    - { path: pol-keycloak/keycloak-admin.env, owner: root, group: root, mode: "0600" }
    - { path: pol-mariadb/mariadb.env, owner: root, group: root, mode: "0600" }
    - { path: pol-file-store/minio.env, owner: root, group: root, mode: "0600" }
