# ==============================================================================
# POLARI SERVICE REGISTRY — accountability of every service kind
# ==============================================================================
# Every service that can appear in ANY orchestration mode (compose | swarm |
# isle) is catalogued here: which files deploy it, what configuration surface
# it has (env files, generated configs, knobs), and how it INTERCONNECTS —
# especially the auto-generated configs that wire prf/psc instances to each
# other and to child instances.
#
# `pol registry check` diffs the services declared in the compose files
# against this registry — an unregistered service is an accountability
# failure (warn), a registered-but-nowhere-deployed service is noted.
#
# Precedent: isle-mesh isle-agent/registry.json (domain-conflict registry).
# This file is DATA for the bld-2+ build pipeline (per-service annotated
# files must 1:1 match registry entries) and for `pol` tooling. It carries
# NO credentials — only pointers to generated env files.
# ==============================================================================

registry_version: 1

# ------------------------------------------------------------------------------
# Instance-level variation axes (how a prf or psc INSTANCE can be configured;
# every per-service conditional in pol-services/ must name one of these in
# its `## variation:` note)
# ------------------------------------------------------------------------------
variation_axes:
  env: [dev, staging-nip, prod, stateless, fullstack-test]
  topology: [single, swarm]        # swarm = isle-mesh stand-in; isle later
  role: [suite, node, twin-b, dask, msci-engines, remote-worker]
  instance: [primary, twin, child-peer]   # multi-instance wiring (below)

# ------------------------------------------------------------------------------
# Auto-generated INTERCONNECTION artifacts — the configs that connect
# instances to each other / to child instances. Each names its generator,
# its consumers, and the seam it wires.
# ------------------------------------------------------------------------------
interconnects:
  prf-runtime-config:
    artifact: ".generated/prf-runtime-config*.json"
    generated_by: [nip-staging-setup.sh, polari-rf-node/staging-setup.sh, polari-rf-node/prod-setup.sh]
    consumed_by: [prf-frontend]
    wires: "frontend -> its backend + keycloak issuer (per env/instance URLs)"
  psc-runtime-config:
    artifact: ".generated/psc-runtime-config.json"
    generated_by: [nip-staging-setup.sh]
    consumed_by: [psc-frontend]
    wires: "psc frontend -> psc backend + keycloak (Political-Scorecard realm)"
  twin-runtime-config:
    artifact: "polari-rf-node/.generated/prf-b-runtime-config.json"
    generated_by: [polari-rf-node/twin-polari-build.sh]
    consumed_by: [prf-frontend-b]
    wires: "instance-B frontend -> instance-B backend (ports 8081/8083)"
  peer-token:
    artifact: "polari-rf-node/.generated/.polari-peer-token"
    generated_by: [polari-rf-node/twin-polari-build.sh]
    consumed_by: [prf-backend, prf-backend-b]
    wires: "instance<->instance peer trust (POLARI_PEER_TOKEN; polari-link net);
            admission flow = PeerAgreement (polariPeers/, mesh_facts)"
  keycloak-client-secrets:
    artifact: "pol-keycloak/keycloak-admin.env + polari-rf-node/prf-keycloak/prf-keycloak-admin.env"
    generated_by: [setup-polari-security.sh, polari-rf-node/staging-setup.sh, polari-rf-node/prod-setup.sh]
    consumed_by: [prf-backend, psc-backend, keycloak startup_shells/configure_clients.sh]
    wires: "backend service-accounts -> keycloak admin API (re-PATCHed at every KC boot)"
  db-credentials:
    artifact: "pol-mariadb/mariadb.env + polari-rf-node/prf-mariadb/mariadb.env + pol-odoo-postgres/odoo-postgres.env(+pol-odoo/odoo.env)"
    generated_by: [setup-polari-security.sh, polari-rf-node/staging-setup.sh, polari-rf-node/prod-setup.sh]
    consumed_by: [pol-mariadb, pol-keycloak, psc-backend, prf-mariadb, prf-keycloak, prf-backend-b(dbcombo), odoo-postgres, odoo]
    wires: "DB users (kc, psc-scorecard-server, polari, odoo) — volume-baked at first init"
  minio-credentials:
    artifact: "pol-file-store/{minio,client}.env; rf-node knobs POLARI_MINIO_ROOT_USER/_PASS"
    generated_by: [setup-polari-security.sh, polari-rf-node/prod-setup.sh]
    consumed_by: [pol-file-store, prf-file-store, prf-backend, psc-backend]
    wires: "object-storage clients -> minio root (client==root today)"
  nginx-proxy-config:
    artifact: ".generated/nginx.{staging,prod}.conf (suite + rf-node)"
    generated_by: [nip-staging-setup.sh, polari-rf-node/staging-setup.sh, polari-rf-node/prod-setup.sh]
    consumed_by: [pol-proxy, prf-proxy]
    wires: "subdomain routing + TLS termination for every web-facing service
            (bld-4 replaces sed templates with segment/assembly generation)"
  scorecard-api-seam:
    artifact: "(scr-7, designed not built) PSC -> /api/scoring wiring"
    generated_by: [SCORING_ACCOUNTABILITY_PLAN.md scr-7]
    consumed_by: [psc-backend, psc-frontend]
    wires: "psc consumes prf's scoring API instead of its own mocks"
  erp-api-seam:
    artifact: "(od-3, designed not built) prf-backend -> odoo /jsonrpc (odooconnect module)"
    generated_by: [ODOO_INTEGRATION_PLAN.md od-3]
    consumed_by: [prf-backend]
    wires: "odooconnect pulls/pushes Odoo models via JSON-RPC — pull free,
            push = knob + typed confirm; sim/ops handles never blur"

# ------------------------------------------------------------------------------
# SERVICE KINDS
# fields: kind (unique), context (build dir), appears_in (compose files,
# repo-relative), config (env_files/generated/knobs), connects_to
# (kind: via-interconnect), variations (notable per-axis differences)
# ------------------------------------------------------------------------------
services:

  # ===== suite-level shared infra (pol-*) =====
  - kind: pol-mariadb
    context: pol-mariadb/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml]
    config: {env_files: [pol-mariadb/mariadb.env], knobs: [POLARI_MYSQL_ROOT_PASS, POLARI_KC_DB_PASS, POLARI_PSC_DB_PASS]}
    connects_to: {pol-keycloak: db-credentials, psc-backend: db-credentials}
    variations: "init.sh creates kc + psc users/dbs; passwords volume-baked"

  - kind: pol-keycloak
    context: pol-keycloak/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml]
    config:
      env_files: [pol-keycloak/keycloak-admin.env, pol-mariadb/mariadb.env]
      mounts: [pol-keycloak/environments/keycloak-suite.conf]
      knobs: [POLARI_KC_ADMIN_USER, POLARI_KC_ADMIN_PASS]
    connects_to: {pol-mariadb: db-credentials, prf-backend: keycloak-client-secrets, psc-backend: keycloak-client-secrets}
    variations: "two realms (Polari, Political-Scorecard); KC_DB_PASSWORD env overrides mounted conf; suite KC serves BOTH prf and psc in combined mode — standalone modes run their own KC"

  - kind: pol-file-store
    context: pol-file-store/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml]
    config: {env_files: [pol-file-store/minio.env], knobs: [POLARI_MINIO_ROOT_USER, POLARI_MINIO_ROOT_PASS]}
    connects_to: {prf-backend: minio-credentials, psc-backend: minio-credentials}

  - kind: pol-proxy
    context: pol-proxy/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml]
    config: {generated: [.generated/nginx.staging.conf], certs: "pol-proxy/certs (generate-pol-certs.sh / ca toolkit)"}
    connects_to: {pol-keycloak: nginx-proxy-config, prf-frontend: nginx-proxy-config, prf-backend: nginx-proxy-config, psc-frontend: nginx-proxy-config, psc-backend: nginx-proxy-config, pol-file-store: nginx-proxy-config, odoo: nginx-proxy-config}
    variations: "staging: nip.io wildcard subdomains; prod: real-domain server blocks; odoo routes are variable-proxy_pass (lazy DNS) so the proxy boots without the odoo profile running"

  # ===== Odoo ERP (business sims + real ops backbone — od-1) =====
  - kind: odoo-postgres
    context: pol-odoo-postgres/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml]
    config: {env_files: [pol-odoo-postgres/odoo-postgres.env], knobs: [POLARI_ODOO_DB_PASS]}
    connects_to: {odoo: db-credentials}
    variations: "compose profile 'odoo' — NOT started by suite up; `pol odoo up`; postgres:16.14 pinned (the suite's first postgres); password volume-baked at first init (drift rescue: pol-odoo/README.md)"

  - kind: odoo
    context: pol-odoo/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml]
    config:
      env_files: [pol-odoo/odoo.env]
      mounts: [pol-odoo/odoo.conf]
      knobs: [POLARI_ODOO_DB_PASS]
    connects_to: {odoo-postgres: db-credentials, prf-backend: erp-api-seam, pol-keycloak: keycloak-client-secrets}
    variations: "compose profile 'odoo'; odoo:18.0-20260723 pinned + OCA auth_oidc wheel; two DBs odoo_sim/odoo_ops (created via `pol odoo init-db` — the sim/ops separation invariant); websocket :8072; humans at odoo.<domain>; SSO via `pol odoo sso-setup` (KC client 'odoo', realm Polari — secret lives KC->odoo DB, never a file); connector module = od-3"

  - kind: psc-redis
    context: (image)
    appears_in: [docker-compose.staging-nip.yml]
    config: {}
    connects_to: {psc-backend: {}}

  # ===== PSC (political scorecard) =====
  - kind: psc-backend
    context: political-scorecard-node/political-scorecard-backend/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml,
                 political-scorecard-node/docker-compose.yml]
    config:
      env_files: [pol-keycloak/keycloak-admin.env, pol-file-store/client.env, .generated/.env.staging]
      interpolation: ["SPRING_DATASOURCE_PASSWORD=${PSC_DB_PASSWORD:-...}"]
    connects_to:
      pol-mariadb: db-credentials
      pol-keycloak: keycloak-client-secrets
      pol-file-store: minio-credentials
      prf-backend: scorecard-api-seam
    variations: "suite mode: shared pol-mariadb/keycloak; standalone psc repo: own mariadb (test creds) + own keycloak — scr-7 will point it at prf's scoring API"

  - kind: psc-frontend
    context: political-scorecard-node/political-scorecard-frontend/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml]
    config: {generated: [.generated/psc-runtime-config.json]}
    connects_to: {psc-backend: psc-runtime-config, pol-keycloak: psc-runtime-config}

  # ===== PRF (polari research framework) =====
  - kind: prf-backend
    context: polari-rf-node/polari-framework/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml,
                 polari-rf-node/docker-compose.yml, polari-rf-node/docker-compose.staging-nip.yml,
                 polari-rf-node/docker-compose.prod.yml, polari-rf-node/docker-compose.stateless.yml,
                 polari-rf-node/docker-compose.fullstack-test.yml]
    config:
      env_files: [".env(.defaults)", "prf-keycloak/prf-keycloak-admin.env | pol-keycloak/keycloak-admin.env",
                  "pol-file-store/client.env (suite)", ".generated/.env.*"]
      knobs: [POLARI_MINIO_ROOT_USER, POLARI_MINIO_ROOT_PASS]
    connects_to:
      prf-keycloak: keycloak-client-secrets
      prf-file-store: minio-credentials
      prf-backend-b: peer-token
      psc-backend: scorecard-api-seam
    variations: "suite vs standalone (which KC/minio/db it binds); sqlite vs mariadb+keydb (dbcombo overlay); stateless (no persistence); child-peer instances join via peer-token + PeerAgreement admission; dask delegation via twin stack; engines delegation via MSCI_ENGINES_URL (degrades to honest suggestion when worker absent)"

  - kind: prf-frontend
    context: polari-rf-node/polari-platform-angular/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml,
                 polari-rf-node/docker-compose.yml, polari-rf-node/docker-compose.staging-nip.yml,
                 polari-rf-node/docker-compose.prod.yml]
    config: {generated: [.generated/prf-runtime-config*.json]}
    connects_to: {prf-backend: prf-runtime-config, prf-keycloak: prf-runtime-config}

  - kind: pol-hub
    context: pol-hub/
    appears_in: [docker-compose.yml, docker-compose.staging-nip.yml, docker-compose.prod.yml]
    config: {static: "committed static files — no env files or generated config"}
    connects_to: {}
    variations: "lightweight informational front door: links out to the heavier prf/psc apps + hosts Mermaid docs; static nginx image, no backend"

  - kind: prf-mariadb
    context: polari-rf-node/prf-mariadb/
    appears_in: [polari-rf-node/docker-compose.yml, polari-rf-node/docker-compose.staging-nip.yml,
                 polari-rf-node/docker-compose.prod.yml, polari-rf-node/docker-compose.stateless.yml,
                 polari-rf-node/docker-compose.fullstack-test.yml]
    config: {env_files: [polari-rf-node/prf-mariadb/mariadb.env], knobs: [POLARI_MARIADB_ROOT_PASS, POLARI_KC_DB_PASS, POLARI_OBJECTS_DB_PASS]}
    connects_to: {prf-keycloak: db-credentials, prf-backend-b: db-credentials}
    variations: "users kc + polari (init.sh hardcodes usernames); dbcombo overlay adds polari_objects_b schema"

  - kind: prf-keycloak
    context: polari-rf-node/prf-keycloak/
    appears_in: [polari-rf-node/docker-compose.yml, polari-rf-node/docker-compose.staging-nip.yml,
                 polari-rf-node/docker-compose.prod.yml, polari-rf-node/docker-compose.stateless.yml,
                 polari-rf-node/docker-compose.fullstack-test.yml]
    config:
      env_files: [polari-rf-node/prf-keycloak/prf-keycloak-admin.env, polari-rf-node/prf-mariadb/mariadb.env]
      baked: [prf-keycloak/environments/keycloak-prf.conf]
      knobs: [POLARI_KC_ADMIN_PASS, POLARI_BE_SECRET]
    connects_to: {prf-mariadb: db-credentials, prf-backend: keycloak-client-secrets}
    variations: "standalone-PRF only (suite mode uses pol-keycloak); Polari realm auto-scaffolded; client secret re-PATCHed at every boot"

  - kind: prf-file-store
    context: (minio image / inline dockerfile)
    appears_in: [polari-rf-node/docker-compose.yml, polari-rf-node/docker-compose.staging-nip.yml,
                 polari-rf-node/docker-compose.prod.yml]
    config: {knobs: [POLARI_MINIO_ROOT_USER, POLARI_MINIO_ROOT_PASS], generated: [".generated/.env.prod (prod creds)"]}
    connects_to: {prf-backend: minio-credentials, prf-backend-b: minio-credentials}

  - kind: prf-proxy
    context: polari-rf-node/prf-proxy/
    appears_in: [polari-rf-node/docker-compose.staging-nip.yml, polari-rf-node/docker-compose.prod.yml]
    config: {generated: [polari-rf-node/.generated/nginx.staging.conf], certs: "prf-proxy/certs"}
    connects_to: {prf-frontend: nginx-proxy-config, prf-backend: nginx-proxy-config, prf-keycloak: nginx-proxy-config, prf-file-store: nginx-proxy-config}

  # ===== multi-instance / compute companions =====
  - kind: prf-backend-b
    context: (reuses prf-backend:staging image)
    appears_in: [polari-rf-node/docker-compose.twin-b.yml, polari-rf-node/docker-compose.dbcombo.yml]
    config:
      env_files: [polari-rf-node/.generated/.env.staging, polari-rf-node/prf-keycloak/prf-keycloak-admin.env]
      knobs: [POLARI_OBJECTS_DB_PASS, POLARI_KEYDB_PASS, POLARI_MINIO_ROOT_USER, POLARI_MINIO_ROOT_PASS]
      generated: [polari-rf-node/.generated/prf-b-runtime-config.json, polari-rf-node/.generated/.polari-peer-token]
    connects_to:
      prf-backend: peer-token
      prf-mariadb: db-credentials
      prf-keydb-b: {}
      prf-file-store: minio-credentials
    variations: "twin = CHILD-INSTANCE pattern: reuses A's images + shared infra, own identity (POLARI_INSTANCE_ID=b), peer network polari-link; dbcombo overlay flips sqlite->mariadb+keydb"

  - kind: prf-frontend-b
    context: (reuses prf-frontend:staging image)
    appears_in: [polari-rf-node/docker-compose.twin-b.yml]
    config: {generated: [polari-rf-node/.generated/prf-b-runtime-config.json]}
    connects_to: {prf-backend-b: twin-runtime-config}

  - kind: prf-keydb-b
    context: (eqalpha/keydb image)
    appears_in: [polari-rf-node/docker-compose.dbcombo.yml]
    config: {knobs: [POLARI_KEYDB_PASS]}
    connects_to: {prf-backend-b: {}}

  - kind: prf-dask
    context: (dask images)
    appears_in: [polari-rf-node/docker-compose.dask.yml]
    config: {}
    connects_to: {prf-backend: {}, prf-backend-b: {}}
    variations: "scheduler + per-side workers; cross-instance parallel search proven (distributed-compute ladder)"

  - kind: prf-msci-engines
    context: polari-rf-node/ (msci engines worker)
    appears_in: [polari-rf-node/docker-compose.msci-engines.yml, polari-rf-node/docker-compose.remote-worker.yml]
    config: {knobs: ["MSCI_ENGINES_URL (consumer side)"]}
    connects_to: {prf-backend: {}, prf-backend-b: {}}
    variations: "INDEPENDENTLY DEPLOYABLE service kind (pol compose engines up); remote-worker variant runs it on another machine; consumers degrade honestly when absent"

  - kind: prf-cad-engines
    context: polari-rf-node/ (CAD import/export worker)
    appears_in: [polari-rf-node/docker-compose.cad-engines.yml]
    config: {knobs: ["CAD_ENGINES_URL (consumer side)", "WITH_FREECAD=1 build arg (FCStd/STEP, ~1.5GB)"]}
    connects_to: {prf-backend: {}, prf-backend-b: {}}
    variations: "INDEPENDENTLY DEPLOYABLE (was MISSING from this registry — scan-4 accountability fix); trimesh baseline + optional FreeCAD; consumers degrade honestly when absent"

  - kind: prf-cnt-engines
    context: polari-rf-node/ (microchip / cntfet engines worker)
    appears_in: [polari-rf-node/docker-compose.cnt-engines.yml]
    config: {knobs: ["CNTFET_ENGINES_URL (consumer side; unset = topology provider cntfet.engines, else local ~/tools)", "CNT_ENGINES_WORKERS (gunicorn workers, default 3)"]}
    connects_to: {prf-backend: {}, prf-backend-b: {}}
    variations: "INDEPENDENTLY DEPLOYABLE (dist-1 2026-08-26): ngspice-46 + OpenVAF + OpenSTA + kwant behind :9700; swarm-pinned to isle-core by default; consumers refuse honestly (never silently local) when a DECLARED worker is absent"

  - kind: prf-recon-engines
    context: polari-rf-node/ (photogrammetry reconstruction worker, scan-4)
    appears_in: [polari-rf-node/docker-compose.recon-engines.yml]
    config: {knobs: ["RECON_ENGINES_URL (consumer side)"]}
    connects_to: {prf-backend: {}, prf-backend-b: {}}
    variations: "INDEPENDENTLY DEPLOYABLE (pol compose recon up); CPU COLMAP 3.11.1 license-gate build (no SiftGPU/GL — SCAN_ENGINES_LICENSE_GATE.md) + trimesh post-processing/export; host chosen by resource ledger (dyn-9); consumers degrade honestly when absent"

  - kind: pol-livekit
    context: polari-rf-node/ (self-hosted LiveKit media server, mtg-1)
    appears_in: [polari-rf-node/docker-compose.livekit.yml]
    config: {knobs: ["LIVEKIT_NODE_IP (host LAN IP for ICE — pol case fills from hostname -I)", "LIVEKIT_URL (consumer side, mtg-2)", "livekit/keys.env (generated, gitignored)"]}
    connects_to: {prf-proxy: {note: "signalling TLS terminates at livekit.prf.<ip>.nip.io; media is DIRECT 50000-50049/udp (netledger-registered range) and never proxies"}}
    variations: "INDEPENDENTLY DEPLOYABLE (pol compose livekit up); upstream Apache-2.0 image (three-source license check 2026-08-12); LAN-only v1, family-sized 4-8; never in the default up — deliberate placement on a bandwidth-adequate host"

  - kind: pol-reticulum
    context: polari-rf-node/reticulum/ (Reticulum mesh sidecar, ret-2)
    appears_in: [polari-rf-node/docker-compose.reticulum.yml]
    config: {knobs: ["RETICULUM_URL (consumer side — backend rns_remote ladder, http://<host>:4285)", "RNS config in the pol-reticulum-data volume (seeded from reticulum/config.template on first start)"]}
    connects_to: {prf-backend: {note: "backend probes /status via rns_remote; inbound mesh data POSTs to /api/reticulum/inbound where it becomes a PROPOSAL (ret-8) — the sidecar never writes rows"}}
    variations: "INDEPENDENTLY DEPLOYABLE (pol compose reticulum up); THE LICENCE BOUNDARY — rns==0.9.4 + lxmf==0.6.3 (last MIT releases; later = GPLv3-incompatible, RETICULUM_LICENCE_GATE.md) imported ONLY here; identity in a NAMED volume (no root-owned host artifacts); radios passed through per-deployment against DeviceLink rows, never seeded"

  - kind: prf-test-harness
    context: polari-rf-node/ (fullstack-test services)
    appears_in: [polari-rf-node/docker-compose.fullstack-test.yml]
    config: {}
    connects_to: {prf-backend: {}, prf-frontend: {}, prf-keycloak: {}}
    variations: "ephemeral CI stack: polari-framework-tests, polari-framework-server, polari-frontend-tests (-test suffixed containers, restart: no)"
