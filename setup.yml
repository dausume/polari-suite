# ==============================================================================
# POLARI SUITE — build values (pol-build/render.py context)
# ==============================================================================
# CREDENTIAL-FREE by policy: templates reference generated env files
# (setup-polari-security.sh), never secret values.
# Variation axis 'env' — see pol-build/registry/services.yml variation_axes.
# ==============================================================================
current-setup:
  env: staging

environments:
  dev:
    suite_image_tag: latest
    gen_env: dev
    prf_runtime_config: ".generated/prf-runtime-config.json"
    psc_runtime_config: ".generated/psc-runtime-config.json"
    pol_hub_runtime_config: ".generated/pol-hub-runtime-config.json"
  staging:
    suite_image_tag: staging
    gen_env: staging
    prf_runtime_config: ".generated/prf-runtime-config.json"
    psc_runtime_config: ".generated/psc-runtime-config.json"
    pol_hub_runtime_config: ".generated/pol-hub-runtime-config.json"
  prod:
    suite_image_tag: prod
    gen_env: prod
    prf_runtime_config: ".generated/prf-runtime-config.prod.json"
    psc_runtime_config: ".generated/psc-runtime-config.prod.json"
    pol_hub_runtime_config: ".generated/pol-hub-runtime-config.prod.json"
