# ================
# Keycloak Isolated Environment Configuration
# ===============

# This overrides the default Keycloak configuration to enforce secure communication

# Note : kcadm.config takes precedence over environment variables!

# ==============================================================================
# DATABASE CONFIGURATION - Consolidated MariaDB
# ==============================================================================
# Connects to the shared pol-mariadb instance
db=mariadb
db-url=jdbc:mariadb://pol-mariadb:3306/keycloak
db-username=kc
# db-password intentionally NOT set here (this file is tracked in a public
# repo). It arrives as the KC_DB_PASSWORD env var via the env_file directive
# on ./pol-mariadb/mariadb.env (generated by setup-polari-security.sh);
# Keycloak env vars override this conf file.

# Disable in proxy mode, enable in suite-mode
#proxy=reencrypt

# Make hostname non-strict for dev/test environments
hostname-strict=false
hostname=https://localhost:8443

http-redirect-to-https=true

logging-level=DEBUG

# --- Https listener (Main Public Interface)
https-listener=secure
https-enabled=true
http-enabled=true
https-port=8443
http-port=8080
https-certificate-file=/opt/certs/pol-kc.crt
https-certificate-key-file=/opt/certs/pol-kc.key

# --- Https Management Interface (Internal)
https-management-enabled=true
https-management-port=9000

# --- Truststore for outbound connections (to Nginx proxy)
# Commented out - JKS files not available, using PEM certs only
#truststore=/etc/keycloak/certs/ca/pol-kc.crt
#truststore-password=changeit
#truststore-type=JKS
#truststore-provider=SUN

# --- Keystore for client authentication (mTLS) to Nginx proxy
# Commented out - JKS files not available, using PEM certs only
#keystore=/etc/keycloak/certs/client/pol-kc.key.jks
#keystore-password=changeit
#keystore-type=JKS
#keystore-provider=SUN