# ================
# Keycloak Suite Environment Configuration
# ===============

# This configuration is for running Keycloak in the polari-suite docker-compose environment
# Replaces environment variables from docker-compose.yml

# Admin credentials (for initial admin user creation)
# Note: These may still need to be set as env vars for initial setup
# KEYCLOAK_ADMIN=admin
# KEYCLOAK_ADMIN_PASSWORD=admin

# ==============================================================================
# DATABASE CONFIGURATION - Consolidated MariaDB
# ==============================================================================
# Connects to the shared pol-mariadb instance
db=mariadb
db-url=jdbc:mariadb://pol-mariadb:3306/keycloak
db-username=kc
db-password=kcpassword

# ==============================================================================
# HOSTNAME CONFIGURATION
# ==============================================================================
# Dev/suite mode: Keycloak is accessed via the proxy at localhost:8443
hostname=https://localhost:8443
hostname-strict=false
hostname-debug=true
hostname-backchannel-dynamic=false

# ==============================================================================
# HTTP/HTTPS CONFIGURATION
# ==============================================================================
http-enabled=true
http-port=8080
http-redirect-to-https=true

# --- HTTPS listener (Main Public Interface)
https-listener=secure
https-enabled=true
https-port=8443
https-certificate-file=/opt/certs/pol-kc.crt
https-certificate-key-file=/opt/certs/pol-kc.key

# ==============================================================================
# PROXY CONFIGURATION
# ==============================================================================
proxy=passthrough

# ==============================================================================
# MONITORING & LOGGING
# ==============================================================================
metrics-enabled=true
log-level=INFO
