# ==============================================================================
# Keycloak — the LEAN production profile (docker-compose.lean.yml, `logins`)
# ==============================================================================
# Mounted as the docker config `keycloak_lean_conf` over the image's baked
# keycloak-isolated.conf. Differences from environments/keycloak-suite.conf:
#
#   * its OWN database service (pol-kc-mariadb), not the shared pol-mariadb
#     that the full profile also gives the scorecard
#   * HTTP only. The edge (pol-proxy) terminates TLS and reaches Keycloak over
#     the encrypted overlay at :8080 — the full profile's mTLS hop to :8443
#     needs certificates that only setup-polari-security.sh generates, and the
#     lean path never runs it.
#   * proxy=none / proxy-headers=xforwarded: the issuer and every redirect must
#     come out as https://auth.<domain>, which is only true if Keycloak trusts
#     the X-Forwarded-* headers nginx sets.
#
# Secrets are NEVER in this file (it is tracked in a public repo). db-password
# arrives as KC_DB_PASSWORD, the hostname as KC_HOSTNAME, the admin account as
# KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD — all env vars, which override this.
# ==============================================================================

db=mariadb
db-url=jdbc:mariadb://pol-kc-mariadb:3306/keycloak
db-username=kc

# hostname comes from KC_HOSTNAME (auth.<domain>); strict off so the health and
# management endpoints answer on the container's own names too.
hostname-strict=false
hostname-backchannel-dynamic=false

http-enabled=true
http-port=8080
http-redirect-to-https=false
https-enabled=false

# the edge is the only way in; trust its forwarded headers
proxy-headers=xforwarded

# /health/ready on the management port (9000) — the compose healthcheck reads it
health-enabled=true
metrics-enabled=false
log-level=INFO
