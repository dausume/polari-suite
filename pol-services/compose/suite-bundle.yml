# # ==============================================================================
# # POLARI SUITE - STAGING ENVIRONMENT (nip.io subdomain routing)
# # ==============================================================================
# #
# # Purpose: Test production builds locally WITH subdomain routing via nip.io
# # Uses: Production Dockerfiles + Resource limits + Subdomain proxy (like real prod)
# #
# # SETUP (run once, or when IP changes):
# #   ./nip-staging-setup.sh
# #
# # USAGE:
# #   sudo docker compose -f docker-compose.staging-nip.yml --env-file .generated/.env.{{ gen_env }} up -d --build
# #
# # ACCESS (auto-rendered from the configured LOCAL_IP):
# #   - Landing:        https://{{ local_ip }}.nip.io
# #   - Keycloak:       https://auth.{{ local_ip }}.nip.io
# #   - PSC Frontend:   https://psc.{{ local_ip }}.nip.io
# #   - PSC API:        https://api.psc.{{ local_ip }}.nip.io
# #   - PRF Frontend:   https://prf.{{ local_ip }}.nip.io
# #   - PRF API:        https://api.prf.{{ local_ip }}.nip.io
# #   - MinIO Console:  https://files.{{ local_ip }}.nip.io
# #   - MinIO S3 API:   https://s3.{{ local_ip }}.nip.io
# #
# # NOTE: extra_hosts use ${LOCAL_IP}, resolved from --env-file at LAUNCH time
# # (the runtime knob); the doc URLs above are rendered from the CONFIGURED
# # LOCAL_IP at BUILD time (env > .generated/.env.staging > route lookup).
