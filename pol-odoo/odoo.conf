; Odoo server configuration — checked in, carries NO secrets (DB creds
; come from pol-odoo/odoo.env via the image entrypoint; see README.md).
[options]
; Behind pol-proxy (odoo.<domain>): trust X-Forwarded-* headers.
proxy_mode = True

; Multi-worker mode so the websocket (gevent) endpoint :8072 is live.
workers = 2
max_cron_threads = 1
gevent_port = 8072

; Two databases only: odoo_sim (simulations, free writes) and odoo_ops
; (REAL ops, guarded) — the hard sim/ops separation invariant. list_db
; False disables the web database manager entirely (no master-password
; surface in v1); DBs are created via `pol odoo init-db <sim|ops>`.
; Pick the DB explicitly with /web/login?db=odoo_sim (or odoo_ops).
list_db = False
dbfilter = ^odoo_(sim|ops)$

; Filestore (attachments) — the odoo-filestore volume.
data_dir = /var/lib/odoo

; Per-worker memory ceilings sized for the 1G container limit.
limit_memory_soft = 402653184
limit_memory_hard = 536870912
limit_time_cpu = 120
limit_time_real = 240
